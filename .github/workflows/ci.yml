name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  periksa:
    name: Lint, typecheck, tes, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:ui
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      # Build tanpa rahasia: variabel server kosong, halaman tetap bisa dibangun.
      - run: npm run build
