<!doctype html>
<html lang="id" data-aksen="ungu" data-tema="terang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopdes Manager — Prototipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  try {
    var a = localStorage.getItem('kopdes-proto-aksen'), t = localStorage.getItem('kopdes-proto-tema');
    if (a) document.documentElement.dataset.aksen = a;
    if (t) document.documentElement.dataset.tema = t;
  } catch (e) {}
</script>
<style>
:root {
  --bg: #F5F6FA; --panel: #FFFFFF; --panel-2: #F0F2F8; --panel-3: #E8EBF4;
  --line: #E4E7F0; --line-2: #D3D8E6;
  --t1: #151829; --t2: #474D66; --t3: #646B85;
  --lambat: #C81E1E; --lambat-soft: #FDECEC; --hari: #9A5B00; --hari-soft: #FFF3DC;
  --shadow-pop: 0 12px 32px -8px rgba(20, 24, 45, .22), 0 2px 6px rgba(20, 24, 45, .08);
  --g1: #2563EB; --g2: #D97706; --g3: #7C3AED; --g4: #16A34A; --g5: #DB2777; --g6: #0891B2;
  --r-kerja: #7C3AED; --r-catatan: #D97706; --r-usaha: #16A34A; --r-koperasi: #2563EB; --r-dunia: #DB2777;
  --fokus: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent);
  color-scheme: light;
}
[data-aksen="ungu"]    { --accent: #6D3FE0; --accent-h: #5A2FC7; --accent-soft: #F0EBFF; --accent-ink: #5A2FC7; --on-accent: #FFFFFF; }
[data-aksen="biru"]    { --accent: #2563EB; --accent-h: #1D4ED8; --accent-soft: #EAF1FF; --accent-ink: #1D4ED8; --on-accent: #FFFFFF; }
[data-aksen="hijau"]   { --accent: #047857; --accent-h: #065F46; --accent-soft: #E3F5EC; --accent-ink: #047857; --on-accent: #FFFFFF; }
[data-aksen="oranye"]  { --accent: #C2410C; --accent-h: #9A3412; --accent-soft: #FFEEE3; --accent-ink: #B13A0A; --on-accent: #FFFFFF; }
[data-aksen="magenta"] { --accent: #BE185D; --accent-h: #9D174D; --accent-soft: #FDEAF2; --accent-ink: #A3154F; --on-accent: #FFFFFF; }
[data-tema="gelap"] {
  --bg: #0E1018; --panel: #161925; --panel-2: #1D2130; --panel-3: #252A3C;
  --line: #2A2F43; --line-2: #383E56;
  --t1: #F1F3FA; --t2: #C2C7DA; --t3: #9AA0B8;
  --lambat: #FF8A8A; --lambat-soft: #3A1C22; --hari: #FFC870; --hari-soft: #33281A;
  --shadow-pop: 0 16px 40px -8px rgba(0, 0, 0, .6);
  --g1: #3B82F6; --g2: #D97706; --g3: #8B5CF6; --g4: #16A34A; --g5: #EC4899; --g6: #0891B2;
  color-scheme: dark;
}
[data-tema="gelap"][data-aksen="ungu"]    { --accent-soft: #2A2246; --accent-ink: #BCA8FF; }
[data-tema="gelap"][data-aksen="biru"]    { --accent-soft: #1A2746; --accent-ink: #9DBBFF; }
[data-tema="gelap"][data-aksen="hijau"]   { --accent-soft: #14302A; --accent-ink: #74E0B4; }
[data-tema="gelap"][data-aksen="oranye"]  { --accent-soft: #3A2318; --accent-ink: #FFB48A; }
[data-tema="gelap"][data-aksen="magenta"] { --accent-soft: #3A1A2C; --accent-ink: #FF9FCB; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.5 'Figtree', system-ui, sans-serif; background: var(--bg); color: var(--t1); -webkit-font-smoothing: antialiased; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--fokus); border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ik { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

/* ---------- Kerangka ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 2px; z-index: 30; }
.ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px 12px; }
.ws-logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: 16px; }
.ws b { display: block; font-size: 14.5px; line-height: 1.2; }
.ws small { color: var(--t3); font-size: 12px; }
.cari-sb { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--t3); width: 100%; margin-bottom: 10px; text-align: left; }
.cari-sb kbd, .kbd { margin-left: auto; font: 600 11px 'Figtree'; color: var(--t3); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.nav-a { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 10px; border-radius: 8px; color: var(--t2); font-weight: 500; text-decoration: none; border: 0; background: none; width: 100%; text-align: left; }
.nav-a:hover { background: var(--panel-2); color: var(--t1); }
.nav-a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
.nav-judul { font-size: 11.5px; font-weight: 700; color: var(--t3); letter-spacing: .04em; text-transform: uppercase; padding: 14px 10px 6px; }
.ruang-btn { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 8px; border-radius: 8px; border: 0; background: none; width: 100%; font-weight: 600; color: var(--t1); }
.ruang-btn:hover { background: var(--panel-2); }
.ruang-ikon { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--c); color: #fff; font-size: 12px; font-weight: 800; flex: none; }
.ruang-btn .ik { margin-left: auto; color: var(--t3); transition: transform .18s; }
.ruang-btn[aria-expanded="false"] .ik { transform: rotate(-90deg); }
.ruang-isi { display: flex; flex-direction: column; gap: 1px; padding: 2px 0 6px; }
.ruang-isi[hidden] { display: none; }
.ruang-isi .nav-a { padding-left: 42px; min-height: 32px; font-size: 13.5px; }
.ruang-isi .nav-a::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-left: -16px; margin-right: 4px; opacity: .8; }
.sb-kaki { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }

.utama { min-width: 0; display: flex; flex-direction: column; }
.atas { position: sticky; top: 0; z-index: 20; height: 60px; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 24px; }
.jejak { display: flex; align-items: center; gap: 8px; color: var(--t3); font-weight: 500; min-width: 0; }
.jejak .ruang-ikon { width: 22px; height: 22px; font-size: 11px; }
.jejak b { color: var(--t1); font-weight: 700; white-space: nowrap; }
.cari-atas { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 38px; width: min(380px, 34vw); padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--t3); text-align: left; }
.ikon-btn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; color: var(--t2); display: grid; place-items: center; position: relative; }
.ikon-btn:hover { background: var(--panel-2); color: var(--t1); }
.ikon-btn .titik-notif { position: absolute; top: 7px; right: 7px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--lambat); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--panel); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: #fff; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.avatar.besar { width: 34px; height: 34px; font-size: 12.5px; }
.contoh { font-size: 11.5px; font-weight: 700; color: var(--hari); background: var(--hari-soft); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.menu-hp { display: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); color: var(--t1); font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--panel-2); }
.btn.utama-btn { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.utama-btn:hover { background: var(--accent-h); }
.btn.kecil { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }

.halaman { padding: 24px 28px 96px; max-width: 1480px; width: 100%; }
.kepala-hal { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.kepala-hal h1 { font-size: 26px; line-height: 1.2; font-weight: 800; margin: 0; letter-spacing: -.01em; }
.kepala-hal .sub { margin: 4px 0 0; color: var(--t2); }
.teks-lambat { color: var(--lambat); font-weight: 700; }
.aksi-hal { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tab tampilan ala ClickUp */
.tab-tampilan { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -4px 0 18px; overflow-x: auto; }
.tab-tampilan button { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 12px; border: 0; background: none; color: var(--t2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab-tampilan button[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
.tab-tampilan button:hover { color: var(--t1); }

/* ---------- Kartu & grid ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.card-kepala { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card h2 { font-size: 15.5px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
.card h2 .hitung { font-size: 12px; font-weight: 700; color: var(--t2); background: var(--panel-2); border-radius: 999px; padding: 1px 8px; }
.tautan { color: var(--accent-ink); font-weight: 600; text-decoration: none; background: none; border: 0; padding: 4px 2px; font-size: 13px; }
.tautan:hover { text-decoration: underline; text-underline-offset: 3px; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--c) 26%, var(--line)); background: color-mix(in srgb, var(--c) 9%, var(--panel)); text-decoration: none; color: inherit; text-align: left; width: 100%; }
.kpi:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
.kpi-ikon { width: 44px; height: 44px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center; flex: none; }
.kpi-ikon .ik { width: 22px; height: 22px; }
.kpi b { display: block; font-size: 30px; line-height: 1.05; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi span { display: block; font-weight: 600; color: var(--t1); }
.kpi small { color: var(--t2); font-size: 12.5px; }

.tambah-cepat { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; margin-bottom: 16px; }
.tambah-cepat .ik { color: var(--accent-ink); }
.tambah-cepat input { flex: 1; min-width: 0; height: 40px; border: 0; background: none; outline: none; }
.tambah-cepat input::placeholder { color: var(--t3); }
.petunjuk { display: flex; gap: 14px; flex-wrap: wrap; color: var(--t3); font-size: 12.5px; margin: -8px 4px 16px; }
.petunjuk code { font: 700 12px 'Figtree'; color: var(--accent-ink); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; }

.grid-beranda { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s8 { grid-column: span 8; } .s6 { grid-column: span 6; } .s4 { grid-column: span 4; } .s12 { grid-column: span 12; } .r2 { grid-row: span 2; }

/* ---------- Baris tugas ---------- */
.daftar-kepala, .baris { display: grid; grid-template-columns: 34px minmax(220px, 1fr) 140px 116px 104px 190px 132px; align-items: center; gap: 10px; }
.daftar-kepala { font-size: 12px; font-weight: 700; color: var(--t3); padding: 0 12px 6px; }
.baris { min-height: 46px; padding: 4px 12px; border-top: 1px solid var(--line); }
.baris:hover { background: var(--panel-2); }
.baris.redup { opacity: .62; }
.cek { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); background: none; display: grid; place-items: center; color: transparent; padding: 0; }
.cek:hover { border-color: #15803D; color: #15803D; }
.cek[aria-pressed="true"] { background: #15803D; border-color: #15803D; color: #fff; }
.cek .ik { width: 13px; height: 13px; stroke-width: 3; }
.judul-btn { border: 0; background: none; padding: 4px 0; text-align: left; font-weight: 600; color: var(--t1); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.judul-btn:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.judul-sel { min-width: 0; display: flex; flex-direction: column; }
.meta-hp { display: none; }
.orang-sel { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--t2); }
.orang-sel span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tenggat { font-size: 13px; font-weight: 600; color: var(--t2); white-space: nowrap; }
.tenggat.lambat { color: var(--lambat); }
.tenggat.hari { color: var(--hari); }
.prio { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--t2); }
.prio .ik { width: 16px; height: 16px; color: var(--pc); fill: color-mix(in srgb, var(--pc) 30%, transparent); }
.proyek-cip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; font-size: 12.5px; font-weight: 600; color: var(--t1); background: color-mix(in srgb, var(--c) 12%, var(--panel)); border-radius: 7px; padding: 3px 9px; }
.proyek-cip i { width: 8px; height: 8px; border-radius: 3px; background: var(--c); flex: none; }
.proyek-cip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ringkas .daftar-kepala, .ringkas .baris { grid-template-columns: 30px minmax(0, 1fr) 118px 104px 124px; }
.ringkas .kol-prio, .ringkas .kol-proyek { display: none; }
.ringkas .meta-hp { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
.ringkas .meta-hp .tenggat, .ringkas .meta-hp .avatar { display: none; }
.ringkas .proyek-cip { font-size: 11.5px; padding: 1px 7px; }
.status-sel { width: 100%; height: 34px; border: 0; border-radius: 8px; background: var(--sb); color: var(--sf); font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: filter .15s, transform .15s; }
.status-sel:hover { filter: brightness(1.08); }
.status-sel:active { transform: scale(.97); }

.grup { margin-bottom: 14px; }
.grup-kepala { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border: 0; background: none; width: 100%; text-align: left; }
.grup-kepala .ik { color: var(--t3); transition: transform .18s; }
.grup-kepala[aria-expanded="false"] .ik { transform: rotate(-90deg); }
.pil-status { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 7px; background: var(--sb); color: var(--sf); font-weight: 800; font-size: 12px; letter-spacing: .03em; text-transform: uppercase; }
.grup-kepala small { color: var(--t3); font-weight: 600; }
.tambah-baris { display: flex; align-items: center; gap: 8px; color: var(--t3); border: 0; border-top: 1px solid var(--line); background: none; width: 100%; padding: 10px 14px; font-weight: 500; text-align: left; }
.tambah-baris:hover { color: var(--accent-ink); background: var(--panel-2); }

.bar-status { display: flex; gap: 3px; height: 30px; margin-bottom: 8px; }
.bar-status button { border: 0; border-radius: 6px; background: var(--sb); color: var(--sf); font-weight: 700; font-size: 12px; padding: 0 8px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bar-status button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--t1); }
.alat { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.cip-filter { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); font-weight: 600; font-size: 13px; color: var(--t2); }
.cip-filter[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); color: var(--accent-ink); }
.cari-kecil { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--t3); }
.cari-kecil input { border: 0; outline: none; background: none; width: 180px; }

/* ---------- Papan ---------- */
.papan { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.kolom { background: var(--panel-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.kolom-kepala { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 4px; }
.kartu-tugas { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; color: inherit; }
.kartu-tugas:hover { border-color: var(--line-2); box-shadow: 0 4px 14px -6px rgba(20, 24, 45, .18); }
.kartu-tugas b { font-weight: 600; }
.kartu-kaki { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sub-prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--t3); }
.sub-prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
.sub-prog i::after { content: ""; display: block; height: 100%; width: var(--p); background: var(--accent); border-radius: 3px; }

/* ---------- Kalender & agenda ---------- */
.kalender { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--line); gap: 1px; }
.kal-hari { background: var(--panel-2); font-size: 12px; font-weight: 700; color: var(--t3); padding: 8px 10px; }
.kal-sel { background: var(--panel); min-height: 116px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.kal-sel.luar { background: var(--panel-2); }
.kal-sel .tgl { font-size: 12.5px; font-weight: 700; color: var(--t2); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.kal-sel.ini .tgl { background: var(--accent); color: var(--on-accent); }
.kal-cip { display: flex; align-items: center; gap: 6px; border: 0; text-align: left; font-size: 12px; font-weight: 600; color: var(--t1); background: color-mix(in srgb, var(--c) 14%, var(--panel)); border-radius: 6px; padding: 3px 7px; min-width: 0; }
.kal-cip i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.kal-cip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kal-cip.selesai span { text-decoration: line-through; color: var(--t3); }

.minggu { display: grid; grid-template-columns: 56px repeat(7, minmax(110px, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: auto; }
.minggu .kh { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px; text-align: center; font-size: 12px; color: var(--t3); font-weight: 700; z-index: 2; }
.minggu .kh b { display: block; font-size: 20px; color: var(--t1); font-weight: 800; }
.minggu .kh.ini b { color: var(--accent-ink); }
.jam-kol { display: flex; flex-direction: column; }
.jam-kol span { height: 52px; font-size: 11.5px; color: var(--t3); text-align: right; padding: 0 8px; transform: translateY(-7px); font-variant-numeric: tabular-nums; }
.hari-kol { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, transparent 0 51px, var(--line) 51px 52px); }
.hari-kol.ini { background-color: color-mix(in srgb, var(--accent) 4%, var(--panel)); }
.acara { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 6px 8px; font-size: 12px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 16%, var(--panel)); color: var(--t1); text-align: left; }
.acara b { display: block; font-weight: 700; line-height: 1.3; }
.acara small { color: var(--t2); }
.garis-kini { position: absolute; left: 0; right: 0; height: 2px; background: var(--lambat); z-index: 1; }
.garis-kini::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--lambat); }

.lini { display: flex; flex-direction: column; }
.lini-item { display: grid; grid-template-columns: 56px 12px 1fr; gap: 10px; align-items: start; padding: 8px 0; }
.lini-item .j { font-weight: 700; font-size: 13px; color: var(--t2); font-variant-numeric: tabular-nums; padding-top: 1px; }
.lini-item .t { width: 12px; height: 12px; border-radius: 50%; background: var(--c); margin-top: 5px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.lini-item b { display: block; font-weight: 600; }
.lini-item small { color: var(--t3); }
.lini-item.lewat { opacity: .55; }
.jenis { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--t2); }

/* ---------- Proyek ---------- */
.proyek-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; margin-bottom: 16px; }
.proyek-kartu { display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.proyek-kartu::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
.proyek-atas { display: flex; align-items: center; gap: 12px; }
.proyek-ikon { width: 40px; height: 40px; border-radius: 11px; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none; }
.proyek-atas b { display: block; font-size: 15.5px; line-height: 1.3; }
.proyek-atas small { color: var(--t3); }
.prog-besar { display: flex; align-items: center; gap: 12px; }
.prog-besar i { flex: 1; height: 10px; border-radius: 6px; background: var(--panel-3); overflow: hidden; }
.prog-besar i::after { content: ""; display: block; height: 100%; width: var(--p); background: var(--c); border-radius: 6px; }
.prog-besar b { font-size: 15px; font-weight: 800; min-width: 44px; text-align: right; }
.statistik { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.statistik div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.statistik b { display: block; font-size: 17px; font-weight: 800; }
.statistik small { color: var(--t3); font-size: 12px; }
.tumpuk { display: flex; }
.tumpuk .avatar { border: 2px solid var(--panel); margin-left: -6px; }
.tumpuk .avatar:first-child { margin-left: 0; }

/* ---------- Grafik ---------- */
figure { margin: 0; }
figcaption { color: var(--t2); font-size: 13px; margin-top: 10px; }
details.tabel { margin-top: 6px; font-size: 13px; }
details.tabel summary { cursor: pointer; color: var(--accent-ink); font-weight: 600; width: max-content; padding: 4px 0; }
.tabel-data { border-collapse: collapse; width: 100%; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tabel-data th, .tabel-data td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tabel-data th { color: var(--t3); font-size: 12px; }
.donat-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donat-wrap svg { width: 168px; height: 168px; flex: none; }
.legenda { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 150px; }
.legenda div { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; font-size: 13px; }
.legenda i { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.legenda b { font-variant-numeric: tabular-nums; }
.legenda small { color: var(--t3); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
.legenda-baris { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--t2); margin-bottom: 8px; }
.legenda-baris span { display: inline-flex; align-items: center; gap: 6px; }
.legenda-baris i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.hbar { display: grid; grid-template-columns: minmax(120px, 160px) 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; }
.hbar .lbl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hbar .lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .trek { display: flex; gap: 2px; height: 14px; }
.hbar .seg { height: 100%; border-radius: 4px; background: var(--c); min-width: 4px; }
.hbar .trek.latar { background: var(--panel-3); border-radius: 5px; gap: 0; }
.hbar b { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 38px; text-align: right; }
.svg-grafik { width: 100%; height: auto; display: block; overflow: visible; }
.svg-grafik text { fill: var(--t3); font: 600 11px 'Figtree'; }
.svg-grafik .grid { stroke: var(--line); stroke-width: 1; }
.svg-grafik .label-nilai { fill: var(--t1); font-weight: 700; }
.tanda { cursor: default; transition: opacity .15s; }
.tanda:focus-visible { outline: none; stroke: var(--t1); stroke-width: 2; }
#tip { position: fixed; z-index: 90; pointer-events: none; background: var(--t1); color: var(--panel); font-size: 12.5px; font-weight: 600; border-radius: 8px; padding: 6px 10px; transform: translate(-50%, calc(-100% - 8px)); white-space: nowrap; box-shadow: var(--shadow-pop); }

/* ---------- Kas ---------- */
.tabel-kas { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tabel-kas th { text-align: left; font-size: 12px; font-weight: 700; color: var(--t3); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.tabel-kas td { padding: 11px 12px; border-bottom: 1px solid var(--line); }
.tabel-kas tr:hover td { background: var(--panel-2); }
.tabel-kas .nom { text-align: right; font-weight: 700; }
.jenis-cip { display: inline-flex; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
.jenis-cip.masuk { background: color-mix(in srgb, var(--g1) 14%, var(--panel)); color: var(--t1); }
.jenis-cip.keluar { background: color-mix(in srgb, var(--g2) 18%, var(--panel)); color: var(--t1); }

/* ---------- Laci, palet perintah, tampilan, toast ---------- */
.tirai { position: fixed; inset: 0; background: rgba(12, 14, 26, .38); z-index: 60; opacity: 0; transition: opacity .2s; }
.tirai.buka { opacity: 1; }
.laci { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--panel); z-index: 70; border-left: 1px solid var(--line); box-shadow: var(--shadow-pop); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
.laci.buka { transform: none; }
.laci-kepala { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.laci-isi { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.laci-isi h2 { font-size: 21px; font-weight: 800; margin: 0; line-height: 1.3; }
.atribut { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; align-items: center; font-size: 13.5px; }
.atribut dt { color: var(--t3); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.atribut dd { margin: 0; display: flex; align-items: center; gap: 8px; }
.sub-daftar { display: flex; flex-direction: column; gap: 2px; }
.sub-daftar label { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.sub-daftar label:hover { background: var(--panel-2); }
.sub-daftar input { width: 18px; height: 18px; accent-color: var(--accent); }
.aktivitas { display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--t2); }
.aktivitas div { display: flex; gap: 10px; align-items: flex-start; }

.palet { position: fixed; inset: 0; z-index: 80; display: grid; justify-items: center; align-items: start; padding-top: 12vh; background: rgba(12, 14, 26, .38); }
.palet[hidden] { display: none; }
.palet-kotak { width: min(620px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-pop); overflow: hidden; }
.palet-kotak .masukan { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.palet-kotak input { flex: 1; height: 54px; border: 0; outline: none; background: none; font-size: 16px; }
.palet-daftar { max-height: 380px; overflow-y: auto; padding: 8px; }
.palet-grup { font-size: 11.5px; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: .04em; padding: 10px 10px 4px; }
.palet-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 9px; text-align: left; font-weight: 500; }
.palet-item[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.palet-item small { margin-left: auto; color: var(--t3); }

.tampilan-btn { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel); box-shadow: var(--shadow-pop); font-weight: 700; }
.tampilan-pop { position: fixed; right: 20px; bottom: 74px; z-index: 55; width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tampilan-pop[hidden] { display: none; }
.tampilan-pop h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--t2); }
.swatch-baris { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.swatch { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--t2); padding: 4px 0; border-radius: 10px; }
.swatch i { width: 34px; height: 34px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #fff; }
.swatch[aria-checked="true"] i { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--c); }
.swatch[aria-checked="true"] { color: var(--t1); }
.segmen { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel-2); border-radius: 10px; padding: 3px; }
.segmen button { border: 0; background: none; height: 34px; border-radius: 8px; font-weight: 600; color: var(--t2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.segmen button[aria-pressed="true"] { background: var(--panel); color: var(--t1); box-shadow: 0 1px 3px rgba(20, 24, 45, .14); }
.catatan-proto { font-size: 12px; color: var(--t3); margin: 0; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 95; background: var(--t1); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-weight: 600; transition: opacity .2s, transform .2s; box-shadow: var(--shadow-pop); }
.toast.tampil { opacity: 1; transform: translate(-50%, 0); }

.kosong { text-align: center; padding: 48px 20px; }
.kosong .ruang-ikon { width: 52px; height: 52px; border-radius: 14px; font-size: 22px; margin: 0 auto 14px; }
.kosong h2 { justify-content: center; font-size: 18px; }
.kosong p { color: var(--t2); max-width: 460px; margin: 8px auto 18px; }

.dok { display: none; }

@media (max-width: 1180px) {
  .s8, .s6 { grid-column: span 12; } .s4 { grid-column: span 6; } .r2 { grid-row: auto; }
  .daftar-kepala, .baris { grid-template-columns: 34px minmax(200px, 1fr) 120px 110px 0 0 128px; }
  .kol-prio, .kol-proyek { display: none; }
}
@media (max-width: 960px) { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 767px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; width: min(300px, 86vw); transform: translateX(-100%); transition: transform .24s; box-shadow: var(--shadow-pop); z-index: 75; }
  .sidebar.buka { transform: none; }
  .menu-hp { display: grid; }
  .atas { padding: 0 12px; gap: 6px; }
  .cari-atas { width: 40px; padding: 0; justify-content: center; margin-left: auto; }
  .cari-atas .teks, .cari-atas .kbd, .atas .tambah-atas, .atas .contoh { display: none; }
  .halaman { padding: 16px 16px calc(110px + env(safe-area-inset-bottom)); }
  .kepala-hal h1 { font-size: 22px; }
  .s4 { grid-column: span 12; }
  .kpi { padding: 12px; gap: 10px; } .kpi-ikon { width: 36px; height: 36px; } .kpi b { font-size: 24px; }
  .daftar-kepala { display: none; }
  .baris, .ringkas .baris { grid-template-columns: 30px minmax(0, 1fr) 112px; grid-template-areas: "c j s"; padding: 8px 10px; }
  .baris > .kol-orang, .baris > .kol-tenggat, .baris > .kol-prio, .baris > .kol-proyek { display: none; }
  .meta-hp { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
  .ringkas .meta-hp .tenggat { display: inline; }
  .ringkas .meta-hp .avatar { display: inline-grid; width: 22px; height: 22px; font-size: 9.5px; }
  .meta-hp .avatar { width: 22px; height: 22px; font-size: 9.5px; }
  .judul-btn { white-space: normal; }
  .tampilan-btn { bottom: calc(84px + env(safe-area-inset-bottom)); right: 16px; width: 44px; height: 44px; padding: 0; justify-content: center; }
  .tampilan-btn .teks-tampilan { display: none; }
  .tampilan-pop { right: 16px; bottom: calc(132px + env(safe-area-inset-bottom)); }
  .dok { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-pop); padding: 6px; justify-content: space-around; align-items: center; }
  .dok a, .dok button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; font-size: 11px; font-weight: 600; color: var(--t3); text-decoration: none; border: 0; background: none; border-radius: 12px; }
  .dok [aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); }
  .dok .fab { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--on-accent); }
  .minggu { grid-template-columns: 44px repeat(7, minmax(120px, 1fr)); }
  .kalender { font-size: 11px; } .kal-sel { min-height: 76px; padding: 3px; } .kal-cip span { display: none; } .kal-cip { padding: 4px; justify-content: center; }
  .tabel-kas .kol-kat { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ik = (id, cls = '') => `<svg class="ik ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

const keTgl = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const selisih = s => Math.round((keTgl(s) - HARI_INI) / 864e5);
const fmtTgl = s => { const d = keTgl(s); return `${d.getDate()} ${BULAN[d.getMonth()]}`; };
const rupiah = n => 'Rp ' + n.toLocaleString('id-ID');

const selesai = t => t.status === 'selesai';
const terlambat = t => !selesai(t) && selisih(t.tenggat) < 0;
const proyekDari = id => PROYEK.find(p => p.id === id);
const avatar = kode => `<span class="avatar" style="--c:${ORANG[kode].warna}" title="${ORANG[kode].nama}">${kode}</span>`;
function labelTenggat(t) {

  if (d === 1) return { teks: 'Besok', kelas: '' };
  return { teks: fmtTgl(t.tenggat), kelas: '' };
}

/* ===== Tooltip & grafik ===== */
const tipEl = $('#tip');
function pasangTip(el, teks) {
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', teks);
  el.classList.add('tanda');
  const tampil = () => {
    const r = el.getBoundingClientRect();
    tipEl.textContent = teks;
    tipEl.hidden = false;
    const x = Math.min(Math.max(r.left + r.width / 2, 90), innerWidth - 90);
    tipEl.style.left = x + 'px';
    tipEl.style.top = r.top + 'px';
  };
  const sembunyi = () => { tipEl.hidden = true; };
  el.addEventListener('pointerenter', tampil);
  el.addEventListener('focus', tampil);
  el.addEventListener('pointerleave', sembunyi);
  el.addEventListener('blur', sembunyi);
}
function lengkapiFigur(fig, ringkasan, kolom, baris) {
  const cap = document.createElement('figcaption');
  cap.textContent = ringkasan;
  const det = document.createElement('details');
  det.className = 'tabel';
  det.innerHTML = `<summary>Lihat tabel</summary><table class="tabel-data"><thead><tr>${kolom.map(k => `<th>${k}</th>`).join('')}</tr></thead><tbody>${baris.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  fig.append(cap, det);
}
const NS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs = {}, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function grafikDonat(fig, data, tengahAngka, tengahLabel) {
  const total = data.reduce((a, d) => a + d.nilai, 0);
  const wrap = document.createElement('div');
  wrap.className = 'donat-wrap';
  const s = svg('svg', { viewBox: '0 0 168 168', role: 'group', 'aria-label': `Donat: ${tengahLabel}` });
  const r = 64, kel = 2 * Math.PI * r;
  let mulai = 0;
  data.forEach(d => {
    if (!d.nilai) return;
    const panjang = d.nilai / total * kel;
    const c = svg('circle', { cx: 84, cy: 84, r, fill: 'none', stroke: d.warna, 'stroke-width': 24, 'stroke-dasharray': `${Math.max(panjang - 3, 1)} ${kel}`, 'stroke-dashoffset': -mulai, transform: 'rotate(-90 84 84)' }, s);
    pasangTip(c, `${d.label}: ${d.nilai} (${Math.round(d.nilai / total * 100)}%)`);
    mulai += panjang;
  });
  const t1 = svg('text', { x: 84, y: 82, 'text-anchor': 'middle', style: 'font:800 30px Figtree;fill:var(--t1)' }, s);
  t1.textContent = tengahAngka;
  const t2 = svg('text', { x: 84, y: 104, 'text-anchor': 'middle', style: 'font:600 12px Figtree;fill:var(--t3)' }, s);
  t2.textContent = tengahLabel;
  const leg = document.createElement('div');
  leg.className = 'legenda';
  leg.innerHTML = data.map(d => `<div style="--c:${d.warna}"><i></i><span>${d.label}</span><b>${d.nilai}</b><small>${Math.round(d.nilai / total * 100)}%</small></div>`).join('');
  wrap.append(s, leg);
  fig.appendChild(wrap);
}
function grafikBatangGrup(fig, kategori, seri, fmt) {
  const W = Math.max(Math.round(fig.clientWidth) || 520, 300), H = 220, kiri = 44, bawah = 28, atas = 18;
  const maks = Math.max(...seri.flatMap(s => s.nilai), 1);
  const langkah = Math.pow(10, Math.floor(Math.log10(maks)));
  const puncak = Math.ceil(maks / langkah) * langkah;
  const leg = document.createElement('div');
  leg.className = 'legenda-baris';
  leg.innerHTML = seri.map(s => `<span style="--c:${s.warna}"><i></i>${s.nama}</span>`).join('');
  fig.appendChild(leg);
  const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'svg-grafik', role: 'group', 'aria-label': seri.map(x => x.nama).join(' dan ') });
  const tinggi = H - bawah - atas;
  for (let i = 0; i <= 4; i++) {
    const y = atas + tinggi - tinggi * i / 4;
    svg('line', { x1: kiri, x2: W, y1: y, y2: y, class: 'grid' }, s);
    const tx = svg('text', { x: kiri - 8, y: y + 4, 'text-anchor': 'end' }, s);
    tx.textContent = fmt(puncak * i / 4);
  }
  const lebarGrup = (W - kiri) / kategori.length;
  const lebarBatang = Math.min(26, (lebarGrup - 24) / seri.length);
  kategori.forEach((k, i) => {
    const x0 = kiri + i * lebarGrup + (lebarGrup - lebarBatang * seri.length - 4 * (seri.length - 1)) / 2;
    seri.forEach((sr, j) => {
      const v = sr.nilai[i];
      const h = v / puncak * tinggi;
      if (k.belum) return;
      const b = svg('rect', { x: x0 + j * (lebarBatang + 4), y: atas + tinggi - h, width: lebarBatang, height: Math.max(h, 1), rx: 4, fill: sr.warna }, s);
      pasangTip(b, `${sr.nama}, ${k.label}: ${fmt(v, true)}`);
    });
    const tx = svg('text', { x: kiri + i * lebarGrup + lebarGrup / 2, y: H - 8, 'text-anchor': 'middle' }, s);
    tx.textContent = k.belum ? `${k.label} (berjalan)` : k.label;
  });
  fig.appendChild(s);
}
function grafikGaris(fig, titik, warna, namaSeri) {
  const W = Math.max(Math.round(fig.clientWidth) || 620, 300), H = 240, kiri = 34, bawah = 28, atas = 22, kanan = 16;
  const maks = Math.max(...titik.map(t => t[1]));
  const puncak = Math.ceil(maks / 2) * 2 + 2;
  const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'svg-grafik', role: 'group', 'aria-label': namaSeri });
  const tinggi = H - bawah - atas, lebar = W - kiri - kanan;
  for (let i = 0; i <= 4; i++) {
    const y = atas + tinggi - tinggi * i / 4;
    svg('line', { x1: kiri, x2: W - kanan, y1: y, y2: y, class: 'grid' }, s);
    const tx = svg('text', { x: kiri - 8, y: y + 4, 'text-anchor': 'end' }, s);
    tx.textContent = Math.round(puncak * i / 4);
  }
  const pts = titik.map((t, i) => [kiri + lebar * i / (titik.length - 1), atas + tinggi - t[1] / puncak * tinggi]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  svg('path', { d: `${d} L ${pts.at(-1)[0]} ${atas + tinggi} L ${pts[0][0]} ${atas + tinggi} Z`, fill: warna, opacity: .12 }, s);
  svg('path', { d, fill: 'none', stroke: warna, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, s);
  pts.forEach((p, i) => {
    const c = svg('circle', { cx: p[0], cy: p[1], r: 4.5, fill: warna, stroke: 'var(--panel)', 'stroke-width': 2 }, s);
    pasangTip(c, `Minggu ${titik[i][0]}: ${titik[i][1]} tugas selesai`);
    const tx = svg('text', { x: p[0], y: H - 8, 'text-anchor': 'middle' }, s);
    tx.textContent = titik[i][0];
  });
  const akhir = pts.at(-1);
  const lbl = svg('text', { x: akhir[0], y: akhir[1] - 12, 'text-anchor': 'end', class: 'label-nilai' }, s);
  lbl.textContent = titik.at(-1)[1] + ' tugas';
  fig.appendChild(s);
}
function hbarTumpuk(fig, baris, kunci) {
  const maks = Math.max(...baris.map(b => b.bagian.reduce((a, x) => a + x.nilai, 0)), 1);
  const leg = document.createElement('div');
  leg.className = 'legenda-baris';
  leg.innerHTML = kunci.map(k => `<span style="--c:${k.warna}"><i></i>${k.label}</span>`).join('');
  fig.appendChild(leg);
  baris.forEach(b => {
    const total = b.bagian.reduce((a, x) => a + x.nilai, 0);
    const el = document.createElement('div');
    el.className = 'hbar';
    el.innerHTML = `<div class="lbl">${b.kepala}<span>${esc(b.label)}</span></div><div class="trek" style="width:${total / maks * 100}%"></div><b>${total}</b>`;
    const trek = $('.trek', el);
    b.bagian.forEach(x => {
      if (!x.nilai) return;
      const seg = document.createElement('i');
      seg.className = 'seg';
      seg.style.cssText = `--c:${x.warna};flex:${x.nilai}`;
      pasangTip(seg, `${b.label}, ${x.label}: ${x.nilai} tugas`);
      trek.appendChild(seg);
    });
    fig.appendChild(el);
  });
}
function hbarNilai(fig, baris) {
  baris.forEach(b => {
    const el = document.createElement('div');
    el.className = 'hbar';
    el.innerHTML = `<div class="lbl">${b.kepala || ''}<span>${esc(b.label)}</span></div><div class="trek latar"></div><b>${b.teks}</b>`;
    const seg = document.createElement('i');
    seg.className = 'seg';
    seg.style.cssText = `--c:${b.warna};width:${Math.max(b.persen, 1)}%`;
    pasangTip(seg, b.tip);
    $('.trek', el).appendChild(seg);
    fig.appendChild(el);
  });
}

function progresProyek(p) {
  const tugas = TUGAS.filter(t => t.proyek === p.id);
  const beres = tugas.filter(selesai).length;
  return { tugas, beres, persen: tugas.length ? Math.round(beres / tugas.length * 100) : 0, lambat: tugas.filter(terlambat).length };
}

/* ===== Halaman: Tugas ===== */
let tampilanTugas = 'daftar', filterStatus = null, filterSaya = false, kataCari = '', grupTertutup = { selesai: true };
function tugasTersaring() {
  return TUGAS.filter(t => (!filterStatus || t.status === filterStatus) && (!filterSaya || t.orang === 'SP') && (!kataCari || t.judul.toLowerCase().includes(kataCari)));
}
function halamanTugas() {
  const tab = (id, label, ikon) => `<button type="button" role="tab" aria-selected="${tampilanTugas === id}" data-tampilan="${id}">${ik(ikon)}${label}</button>`;

    <div class="alat">

function isiTugas() {
  const daftar = tugasTersaring();
  if (!daftar.length) return `<div class="card kosong"><h2>Tidak ada tugas yang cocok</h2><p>Ubah kata kunci atau hapus saringan.</p><button class="btn" type="button" data-hapus-semua>Hapus saringan</button></div>`;
  if (tampilanTugas === 'papan') return papan(daftar);
  if (tampilanTugas === 'kalender') return kalender(daftar);
  return URUT.map(k => {
    const isi = daftar.filter(t => t.status === k).sort((a, b) => a.tenggat.localeCompare(b.tenggat));
    if (!isi.length) return '';
    const s = STATUS[k], tutup = !!grupTertutup[k];
    return `<section class="card grup" style="padding:6px 6px 0"><button class="grup-kepala" type="button" aria-expanded="${!tutup}" data-grup="${k}">${ik('i-chev')}<span class="pil-status" style="--sb:${s.bg};--sf:${s.fg}">${s.label}</span><small>${isi.length} tugas</small></button>

function papan(daftar) {

    return `<section class="kolom" aria-label="${s.label}"><div class="kolom-kepala"><span class="pil-status" style="--sb:${s.bg};--sf:${s.fg}">${s.label}</span><small style="color:var(--t3);font-weight:700">${isi.length}</small></div>

function kalender(daftar) {
  const hariNama = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
  const awal = new Date(2026, 9, 1), geser = (awal.getDay() + 6) % 7;
  let sel = hariNama.map(h => `<div class="kal-hari">${h}</div>`).join('');
  for (let i = 0; i < 35; i++) {
    const d = new Date(2026, 9, 1 - geser + i), luar = d.getMonth() !== 9;
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const isi = daftar.filter(t => t.tenggat === iso);
    sel += `<div class="kal-sel ${luar ? 'luar' : ''} ${iso === '2026-10-21' ? 'ini' : ''}"><span class="tgl">${d.getDate()}</span>${isi.map(t => `<button class="kal-cip ${selesai(t) ? 'selesai' : ''}" type="button" data-buka="${t.id}" style="--c:${(proyekDari(t.proyek) || { warna: '#94A3B8' }).warna}" title="${esc(t.judul)}"><i></i><span>${esc(t.judul)}</span></button>`).join('')}</div>`;
  }
  return `<div class="card-kepala"><h2 style="font-size:17px">Oktober 2026</h2><div class="legenda-baris" style="margin:0">${PROYEK.map(p => `<span style="--c:${p.warna}"><i></i>${p.nama}</span>`).join('')}</div></div><div class="kalender">${sel}</div>`;

/* ===== Halaman: Agenda ===== */
function halamanAgenda() {
  const hariNama = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
  const MULAI = 7, AKHIR = 19, T = 52;
  const jamKol = Array.from({ length: AKHIR - MULAI }, (_, i) => `<span>${String(MULAI + i).padStart(2, '0')}.00</span>`).join('');

}

function tambahCepat(teks) {
  teks = teks.trim();
  if (!teks) { toast('Tulis judul tugas dulu'); return; }
  let orang = 'SP', proyek = null, prioritas = 'sedang', geser = 0;
  teks = teks.replace(/@(\S+)/, (_, n) => { const k = Object.keys(ORANG).find(x => ORANG[x].nama.toLowerCase().startsWith(n.toLowerCase())); if (k) orang = k; return ''; });
  teks = teks.replace(/#(\S+)/, (_, n) => { const p = PROYEK.find(x => x.nama.toLowerCase().includes(n.toLowerCase())); if (p) proyek = p.id; return ''; });
  teks = teks.replace(/!(tinggi|sedang|rendah)/i, (_, n) => { prioritas = n.toLowerCase(); return ''; });
  teks = teks.replace(/\b(besok|lusa)\b/i, (_, n) => { geser = n.toLowerCase() === 'besok' ? 1 : 2; return ''; });
  const d = new Date(HARI_INI); d.setDate(d.getDate() + geser);
  const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const judul = teks.replace(/\s+/g, ' ').trim() || 'Tugas baru';
  TUGAS.push({ id: Math.max(...TUGAS.map(t => t.id)) + 1, judul, proyek, orang, tenggat: iso, status: 'rencana', prioritas, sub: [0, 0] });
  toast(`Ditambahkan: ${judul} · ${ORANG[orang].nama.split(' ')[0]} · ${geser === 0 ? 'hari ini' : geser === 1 ? 'besok' : 'lusa'}`);
  tampilkanUlang();
  $('#tc-input') && $('#tc-input').focus();
}
function salinLaporan() {
  const l = TUGAS.filter(terlambat), h = TUGAS.filter(t => !selesai(t) && selisih(t.tenggat) === 0);
  const teks = `Laporan harian KDMP Sukamaju — Rabu, 21 Oktober 2026\nTerlambat (${l.length}): ${l.map(t => t.judul).join('; ')}\nHari ini (${h.length}): ${h.map(t => t.judul).join('; ')}`;
  (navigator.clipboard ? navigator.clipboard.writeText(teks) : Promise.reject()).then(() => toast('Laporan disalin, siap ditempel ke grup WhatsApp'), () => toast('Peramban menolak menyalin; laporan tidak tersalin'));
}

/* ===== Palet perintah ===== */
let paletItem = [], paletPilih = 0;
function kumpulanPalet(q) {
  q = q.toLowerCase();
  const halaman = [...ATAS.map(([id, l]) => ({ grup: 'Halaman', label: l, ket: 'Umum', jalankan: () => location.hash = '#' + id })),
    ...RUANG.flatMap(r => r.halaman.map(([id, l]) => ({ grup: 'Halaman', label: l, ket: r.nama, jalankan: () => location.hash = '#' + id })))];
  const aksi = [
    { grup: 'Perintah', label: 'Tambah tugas', ket: 'N', jalankan: () => document.querySelector('[data-aksi="tambah-tugas"]').click() },
    { grup: 'Perintah', label: 'Buat rapat', ket: 'Agenda', jalankan: () => location.hash = '#agenda' },
    { grup: 'Perintah', label: 'Catat uang masuk', ket: 'Buku kas', jalankan: () => location.hash = '#kas' },
    { grup: 'Perintah', label: 'Catat uang keluar', ket: 'Buku kas', jalankan: () => location.hash = '#kas' },
    { grup: 'Perintah', label: 'Ganti tema terang/gelap', ket: 'Tampilan', jalankan: () => aturTema(document.documentElement.dataset.tema === 'gelap' ? 'terang' : 'gelap') },
    { grup: 'Perintah', label: 'Salin laporan hari ini', ket: 'WhatsApp', jalankan: salinLaporan }
  ];
  const tugas = q ? TUGAS.filter(t => t.judul.toLowerCase().includes(q)).slice(0, 6).map(t => ({ grup: 'Tugas', label: t.judul, ket: STATUS[t.status].label, jalankan: () => { location.hash = '#tugas'; setTimeout(() => bukaLaci(t.id), 60); } })) : [];
  return [...aksi, ...halaman, ...tugas].filter(x => !q || x.label.toLowerCase().includes(q) || x.ket.toLowerCase().includes(q));
}
function renderPalet() {
  paletItem = kumpulanPalet($('#palet-input').value);
  paletPilih = Math.min(paletPilih, Math.max(paletItem.length - 1, 0));
  let grupTerakhir = '';
  $('#palet-daftar').innerHTML = paletItem.length ? paletItem.map((x, i) => {
    const kepala = x.grup !== grupTerakhir ? `<div class="palet-grup">${x.grup}</div>` : '';
    grupTerakhir = x.grup;
    return `${kepala}<button class="palet-item" type="button" role="option" id="po-${i}" aria-selected="${i === paletPilih}" data-po="${i}">${esc(x.label)}<small>${esc(x.ket)}</small></button>`;
  }).join('') : '<p style="padding:16px;color:var(--t3);margin:0">Tidak ada hasil.</p>';
  const pilih = $(`#po-${paletPilih}`);
  if (pilih) pilih.scrollIntoView({ block: 'nearest' });
}
function bukaPalet() { $('#palet').hidden = false; $('#palet-input').value = ''; paletPilih = 0; renderPalet(); $('#palet-input').focus(); }
function tutupPalet() { $('#palet').hidden = true; }
function jalankanPalet(i) { const x = paletItem[i]; if (!x) return; tutupPalet(); x.jalankan(); }

$('#palet-input').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { paletPilih = Math.min(paletPilih + 1, paletItem.length - 1); renderPalet(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { paletPilih = Math.max(paletPilih - 1, 0); renderPalet(); e.preventDefault(); }
  if (e.key === 'Enter') { jalankanPalet(paletPilih); e.preventDefault(); }
});

  if (e.key === 'Escape') {

  document.querySelectorAll('#tema button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tema === document.documentElement.dataset.tema));
}
function aturAksen(id) { document.documentElement.dataset.aksen = id; lsSet('kopdes-proto-aksen', id); renderSwatch(); }
function aturTema(id) { document.documentElement.dataset.tema = id; lsSet('kopdes-proto-tema', id); renderSwatch(); }
$('#swatch').addEventListener('click', e => { const b = e.target.closest('[data-aksen]'); if (b) aturAksen(b.dataset.aksen); });
$('#swatch').addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
  const i = AKSEN.findIndex(a => a[0] === document.documentElement.dataset.aksen);
  const j = (i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + AKSEN.length) % AKSEN.length;
  aturAksen(AKSEN[j][0]); $(`#swatch [data-aksen="${AKSEN[j][0]}"]`).focus(); e.preventDefault();
});
$('#tema').addEventListener('click', e => { const b = e.target.closest('[data-tema]'); if (b) aturTema(b.dataset.tema); });
function togglePop(buka) { $('#tampilan-pop').hidden = !buka; $('#tampilan-btn').setAttribute('aria-expanded', buka); }
$('#tampilan-btn').addEventListener('click', () => togglePop($('#tampilan-pop').hidden));

/* ===== Toast ===== */
let toastWaktu;
function toast(teks) { const t = $('#toast'); t.textContent = teks; t.classList.add('tampil'); clearTimeout(toastWaktu); toastWaktu = setTimeout(() => t.classList.remove('tampil'), 2600); }

renderSwatch();
tampilkan();
</script>
</body>
</html>
