<!doctype html>
<html lang="id" data-theme="light" data-accent="ungu" data-font="jakarta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopdes Manager · Prototipe</title>
<script>
  // Terapkan tema sebelum halaman tampil agar tidak berkedip.
  try {
    const p = JSON.parse(localStorage.getItem('kopdes-proto') || '{}');
    const r = document.documentElement;
    if (p.theme) r.dataset.theme = p.theme;
    if (p.accent) r.dataset.accent = p.accent;
    if (p.font) r.dataset.font = p.font;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Manrope:wght@400..800&family=Nunito:wght@400..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* ---------- Token tema: satu-satunya tempat warna mentah ---------- */
:root {
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --bg: #EEF1FB; --bg-2: #F5EFFC;
  --surface: #FFFFFF; --surface-2: #F5F6FC; --surface-3: #ECEEF8;
  --line: #E3E6F3; --line-2: #D3D8EC;
  --text: #1D2142; --text-2: #545A7E; --text-3: #646A8F;
  --acc: #6C5CE7; --acc-hover: #5B4BD6; --acc-soft: #EEEBFE; --acc-ink: #4F3FCC; --on-acc: #FFFFFF;
  --ring-a: #5AB8F0; --ring-b: #FF7FA3; --ring-track: #E8ECF8;
  --todo-bg: #EFEBFF; --todo-ink: #5845C9; --todo-dot: #9B8CFF;
  --doing-bg: #E2F2FD; --doing-ink: #1C6A9E; --doing-dot: #5AB8F0;
  --done-bg: #E0F6EC; --done-ink: #167A55; --done-dot: #3CC9A0;
  --late-bg: #FFE7EC; --late-ink: #BE2C4C; --late-dot: #FF7F98;
  --warn-ink: #A8650A;
  --p-gerai: #FF8FAB; --p-gudang: #5AB8F0; --p-rapat: #9B8CFF; --p-admin: #3CC9A0;
  --av-ink: #1D2142;
  --scrim: rgba(16, 19, 42, .28);
  --toast-bg: #1D2142; --toast-ink: #F2F3FB;
  --shadow-1: 0 1px 2px rgba(29,33,66,.04), 0 6px 20px -10px rgba(52,64,140,.20);
  --shadow-2: 0 2px 4px rgba(29,33,66,.05), 0 16px 36px -14px rgba(52,64,140,.30);
  --shadow-3: 0 24px 60px -18px rgba(30,36,90,.40);
  --r-xl: 24px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
[data-accent="biru"]    { --acc: #2F6FE0; --acc-hover: #255FCC; --acc-soft: #E5EEFD; --acc-ink: #1F57BE; }
[data-accent="hijau"]   { --acc: #0A7D5C; --acc-hover: #086A4E; --acc-soft: #DFF4EC; --acc-ink: #08694D; }
[data-accent="oranye"]  { --acc: #BA490A; --acc-hover: #A23F08; --acc-soft: #FCEADF; --acc-ink: #A03F08; }
[data-accent="magenta"] { --acc: #CF2E6C; --acc-hover: #B7265E; --acc-soft: #FCE6EF; --acc-ink: #AE2259; }

[data-theme="dark"] {
  --bg: #10132A; --bg-2: #191538;
  --surface: #1A1E3A; --surface-2: #20254A; --surface-3: #282E57;
  --line: #2B3158; --line-2: #3A416F;
  --text: #EEF0FB; --text-2: #B3B9DA; --text-3: #979EC4;
  --acc: #9A8DFF; --acc-hover: #AEA3FF; --acc-soft: rgba(154,141,255,.18); --acc-ink: #C6BEFF; --on-acc: #10132A;
  --ring-track: #282E57;
  --todo-bg: rgba(155,140,255,.16); --todo-ink: #C6BCFF;
  --doing-bg: rgba(90,184,240,.16); --doing-ink: #A3D8F8;
  --done-bg: rgba(60,201,160,.16); --done-ink: #8BE4C6;
  --late-bg: rgba(255,127,152,.16); --late-ink: #FFADBE;
  --warn-ink: #F2B755;
  --scrim: rgba(4, 6, 18, .55);
  --toast-bg: #EEF0FB; --toast-ink: #1A1E3A;
  --shadow-1: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.55);
  --shadow-2: 0 2px 4px rgba(0,0,0,.3), 0 18px 40px -14px rgba(0,0,0,.65);
  --shadow-3: 0 28px 70px -18px rgba(0,0,0,.75);
  color-scheme: dark;
}
[data-theme="dark"][data-accent="biru"]    { --acc: #6FA3FF; --acc-hover: #8AB5FF; --acc-soft: rgba(111,163,255,.18); --acc-ink: #A9C8FF; }
[data-theme="dark"][data-accent="hijau"]   { --acc: #4FD1A5; --acc-hover: #6EDBB5; --acc-soft: rgba(79,209,165,.16); --acc-ink: #8FE6C8; }
[data-theme="dark"][data-accent="oranye"]  { --acc: #FF9A5C; --acc-hover: #FFAE7A; --acc-soft: rgba(255,154,92,.16); --acc-ink: #FFC29C; }
[data-theme="dark"][data-accent="magenta"] { --acc: #FF7AAE; --acc-hover: #FF94BE; --acc-soft: rgba(255,122,174,.16); --acc-ink: #FFB0CE; }

[data-font="manrope"] { --font: 'Manrope', system-ui, sans-serif; }
[data-font="dmsans"]  { --font: 'DM Sans', system-ui, sans-serif; }
[data-font="nunito"]  { --font: 'Nunito', system-ui, sans-serif; }

/* ---------- Dasar ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--text);
  background: var(--bg);
  background-image: radial-gradient(1100px 620px at 105% -10%, var(--bg-2), transparent 62%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
::selection { background: var(--acc-soft); color: var(--acc-ink); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lucide { width: 18px; height: 18px; stroke-width: 1.8; flex: none; }
kbd { font: 600 11px/1 var(--font); padding: 4px 6px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); border: 1px solid var(--line); }

/* ---------- Kerangka ---------- */
.app {
  display: grid; grid-template-columns: 248px minmax(0, 1fr) 320px; gap: 20px;
  padding: 20px; min-height: 100dvh; max-width: 1680px; margin: 0 auto;
}
.sidebar {
  position: sticky; top: 20px; height: calc(100dvh - 40px);
  display: flex; flex-direction: column; gap: 8px;
  background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-1);
  padding: 18px 12px 12px; overflow: hidden;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 10px; color: inherit; text-decoration: none; }
.logo {
  width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, var(--ring-a), var(--ring-b)); color: #fff;
}
.logo .lucide { width: 20px; height: 20px; stroke-width: 2.2; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.brand-text span { font-size: 12px; color: var(--text-3); font-weight: 600; }

.nav { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 0; margin: 0 -4px; padding-inline: 4px; }
.nav-ind {
  position: absolute; left: 4px; right: 4px; top: 0; height: 40px; border-radius: 12px;
  background: var(--acc-soft); opacity: 0; pointer-events: none;
  transition: transform .45s var(--ease), height .45s var(--ease), opacity .2s;
}
.nav-group + .nav-group { margin-top: 10px; }
.group-head {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--text-3);
}
.group-head:hover { color: var(--text); }
.group-head .lucide { width: 16px; height: 16px; transition: transform .35s var(--ease); }
.group-head[aria-expanded="false"] .lucide { transform: rotate(-90deg); }
.group-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .4s var(--ease); }
.group-body > ul { overflow: hidden; min-height: 0; }
.group-head[aria-expanded="false"] + .group-body { grid-template-rows: 0fr; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px;
  padding: 0 12px; border-radius: 12px; color: var(--text-2); font-size: 14px; font-weight: 600; text-align: left;
  transition: color .2s, background .2s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"] { color: var(--acc-ink); background: transparent; }
.nav-item[aria-current="page"]:hover { background: transparent; }
.nav-item .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .badge {
  min-width: 22px; height: 20px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; background: var(--surface-3); color: var(--text-2);
}
.nav-item[aria-current="page"] .badge { background: var(--surface); color: var(--acc-ink); }
.nav-item .pdot { width: 10px; height: 10px; border-radius: 4px; background: var(--c); margin: 0 4px; flex: none; }
.nav-item.is-proj[aria-pressed="true"] { color: var(--text); background: var(--surface-2); }

.side-foot { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.profile { display: flex; align-items: center; gap: 10px; padding: 8px; margin-top: 4px; border-radius: 14px; background: var(--surface-2); }
.profile .who { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.profile strong { font-size: 14px; }
.profile span { font-size: 12px; color: var(--text-3); }

.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; align-items: center; gap: 12px; }
.brand-mini { display: none; }
.search {
  flex: 1; min-width: 0; max-width: 520px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 16px;
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-1); color: var(--text-3); font-size: 14px;
  transition: box-shadow .25s var(--ease), transform .25s var(--ease);
}
.search:hover { box-shadow: var(--shadow-2); }
.search span { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.demo-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 99px; white-space: nowrap;
  font-size: 12px; font-weight: 700; color: var(--warn-ink); background: var(--surface); box-shadow: var(--shadow-1);
}
.demo-pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.icon-btn {
  width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; flex: none;
  background: var(--surface); box-shadow: var(--shadow-1); color: var(--text-2);
  transition: color .2s, transform .25s var(--ease), box-shadow .25s var(--ease);
}
.icon-btn:hover { color: var(--text); box-shadow: var(--shadow-2); }
.icon-btn:active { transform: scale(.95); }
.icon-btn.flat { background: transparent; box-shadow: none; }
.icon-btn.flat:hover { background: var(--surface-2); }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 10px; }
.icon-btn.xs { width: 28px; height: 28px; border-radius: 8px; }
.icon-btn.sm .lucide, .icon-btn.xs .lucide { width: 16px; height: 16px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px;
  border-radius: 14px; font-weight: 700; font-size: 14px; white-space: nowrap;
  transition: background .2s, transform .2s var(--ease), box-shadow .25s var(--ease), color .2s;
}
.btn:active { transform: scale(.97); }
.btn.sm { height: 36px; padding: 0 12px; border-radius: 12px; font-size: 13px; }
.btn-primary { background: var(--acc); color: var(--on-acc); box-shadow: 0 8px 20px -10px var(--acc); }
.btn-primary:hover { background: var(--acc-hover); }
.btn-soft { background: var(--acc-soft); color: var(--acc-ink); }
.btn-soft:hover { filter: brightness(.97); }
.btn-ghost { color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-ghost.danger:hover { color: var(--late-ink); background: var(--late-bg); }
.link { color: var(--acc-ink); font-weight: 700; font-size: 13px; padding: 6px 8px; border-radius: 8px; }
.link:hover { background: var(--acc-soft); }

.card { background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-1); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 8px; }
h2 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 30px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; outline: none; }
.page-head .sub { color: var(--text-2); margin-top: 4px; }

/* ---------- Beranda ---------- */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; padding: 24px 28px; }
/* Cincin memakai conic-gradient agar warnanya selalu mulai dari langit di jam 12 dan berakhir mawar di ujung busur. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
.ring-wrap { --p: 0; position: relative; width: 168px; height: 168px; transition: --p 1.1s var(--ease); }
.ring { position: absolute; inset: 0; }
.ring-track, .ring-arc { position: absolute; inset: 0; border-radius: 50%; -webkit-mask: radial-gradient(farthest-side, transparent 79.5%, #000 80.5%); mask: radial-gradient(farthest-side, transparent 79.5%, #000 80.5%); }
.ring-track { background: var(--ring-track); }
.ring-arc { background: conic-gradient(var(--ring-a) 0%, var(--ring-b) calc(var(--p) * 1%), transparent calc(var(--p) * 1%)); }
.ring-cap { position: absolute; inset: 0; pointer-events: none; }
.ring-cap::before { content: ''; position: absolute; left: 45%; top: 0; width: 10%; height: 10%; border-radius: 50%; }
.ring-cap.start::before { background: var(--ring-a); }
.ring-cap.end { transform: rotate(calc(var(--p) * 3.6deg)); }
.ring-cap.end::before { background: var(--ring-b); }
.ring-wrap.is-empty .ring-cap { display: none; }
.hero { position: relative; }
.urgent {
  /* Melayang di tepi atas kartu cincin, di ruang kosong kanan judul halaman, agar tidak menutupi teks. */
  position: absolute; top: -62px; right: 22px; z-index: 2; width: min(300px, 46%);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 12px 14px;
  background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-2); cursor: pointer; text-align: left;
  transform: rotate(2deg); transition: transform .4s var(--ease), box-shadow .4s var(--ease);
  animation: float 5s ease-in-out infinite alternate;
}
.urgent:hover { transform: rotate(0deg) translateY(-3px); box-shadow: var(--shadow-3); animation-play-state: paused; }
@keyframes float { from { translate: 0 0; } to { translate: 0 -6px; } }
.urgent .tag { grid-column: 2; justify-self: start; height: 22px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 800; background: var(--late-bg); color: var(--late-ink); }
.urgent .check { grid-row: 1 / span 3; }
.urgent .u-title { grid-column: 2; font-weight: 800; font-size: 14px; line-height: 1.3; text-align: left; border-radius: 6px; }
.urgent .u-meta { grid-column: 2; display: flex; align-items: center; gap: 10px; font-size: 12px; }
.urgent .u-meta .due { font-size: 12px; }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-label strong { font-size: 36px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.ring-label span { font-size: 13px; color: var(--text-3); font-weight: 600; margin-top: 4px; }
.hero-body h2 { font-size: 20px; }
.hero-text { color: var(--text-2); margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.stat {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 16px; border-radius: 18px;
  text-align: left; font-size: 13px; font-weight: 700;
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-1); }
.stat .stat-num { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.stat-late { background: var(--late-bg); color: var(--late-ink); }
.stat-today { background: var(--doing-bg); color: var(--doing-ink); }
.stat-week { background: var(--todo-bg); color: var(--todo-ink); }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 10px; }
.day {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 8px; border-radius: 16px;
  color: var(--text-2); transition: background .3s var(--ease), color .3s, transform .3s var(--ease);
}
.day:hover { background: var(--surface-2); }
.day .d-name { font-size: 12px; font-weight: 700; }
.day .d-num { font-size: 18px; font-weight: 800; color: var(--text); }
.day .d-dots { display: flex; gap: 3px; height: 6px; margin-top: 2px; }
.day .d-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.day.is-today .d-num { color: var(--acc-ink); }
.day[aria-pressed="true"] { background: var(--acc); color: var(--on-acc); box-shadow: 0 10px 22px -12px var(--acc); transform: translateY(-2px); }
.day[aria-pressed="true"] .d-num { color: var(--on-acc); }
.day[aria-pressed="true"] .d-dots i { background: var(--on-acc); opacity: .85; }

.tasks-card { padding-bottom: 8px; }
.tasks-card .task-list { padding: 4px 8px 4px; }
.only-narrow { display: none; }

/* ---------- Baris tugas ---------- */
.task-list { display: flex; flex-direction: column; gap: 2px; position: relative; min-height: 8px; }
.row { position: relative; border-radius: 16px; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
.row-inner {
  position: relative; z-index: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto;
  align-items: center; gap: 14px; min-height: 60px; padding: 10px 12px; border-radius: 16px;
  background: var(--surface); cursor: pointer; transition: background .2s;
}
.row:hover .row-inner { background: var(--surface-2); }
.row:focus-visible { outline: none; }
.row:focus-visible .row-inner { box-shadow: inset 0 0 0 2px var(--acc); }
.row-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s; }
.row-meta { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--text-3); font-weight: 600; min-width: 0; }
.row-meta > * { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.row-meta .lucide { width: 14px; height: 14px; }
.row-meta .due-inline { display: none; font-size: 12.5px; }
.proj .dot, .chip .dot, .col-head .dot, .group-head2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.row.is-done .row-title { color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.row.is-done .due, .row.is-done .prio { opacity: .55; }
.swipe-bg {
  position: absolute; inset: 0; border-radius: 16px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; font-weight: 800; font-size: 13px; opacity: 0;
}
.swipe-bg span { display: inline-flex; align-items: center; gap: 6px; }
.row.swiping .swipe-bg { opacity: 1; }
.row[data-dir="right"] .swipe-bg { background: var(--done-bg); color: var(--done-ink); }
.row[data-dir="left"] .swipe-bg { background: var(--doing-bg); color: var(--doing-ink); }
.row[data-dir="right"] .sw-later, .row[data-dir="left"] .sw-done { visibility: hidden; }
.row.armed .swipe-bg span { transform: scale(1.08); }

.check {
  position: relative; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none;
  border: 2px solid var(--line-2); color: transparent; background: var(--surface);
  transition: border-color .2s, background .3s var(--ease), color .2s, transform .3s var(--ease);
}
.check::before { content: ''; position: absolute; inset: -9px; }
.check .lucide { width: 15px; height: 15px; stroke-width: 3; }
.check:hover { border-color: var(--acc); color: var(--acc); }
.check[aria-checked="true"] {
  border-color: transparent; color: #fff;
  background: linear-gradient(135deg, var(--ring-a), var(--ring-b));
}
.check.pop { animation: pop .45s var(--ease); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.check.sm { width: 22px; height: 22px; }
.check.sm .lucide { width: 13px; height: 13px; }

.due { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text-2); white-space: nowrap; }
.due .lucide { width: 15px; height: 15px; }
.due.is-late { color: var(--late-ink); }
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.prio .lucide { width: 14px; height: 14px; }
.prio-tinggi { color: var(--late-ink); }
.prio-sedang { color: var(--warn-ink); }
.prio-rendah { color: var(--text-3); }
.prio.icon-only span { display: none; }

.avs { display: flex; align-items: center; }
.av {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 11.5px; font-weight: 800; color: var(--av-ink); background: var(--c);
  box-shadow: 0 0 0 2px var(--surface);
}
.avs .av + .av { margin-left: -8px; }
.avs .more { background: var(--surface-3); color: var(--text-2); }

.empty { padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--text-2); }
.task-list:empty::before, .col-list:empty::before {
  content: attr(data-empty); display: block; padding: 18px; text-align: center; color: var(--text-3);
  font-size: 13px; font-weight: 600; border: 1.5px dashed var(--line-2); border-radius: 16px;
}

/* ---------- Tugas: tab, filter, papan ---------- */
.tabs { position: relative; display: flex; gap: 2px; padding: 4px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-1); }
.tab {
  position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
  border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-2); transition: color .25s;
}
.tab .lucide { width: 16px; height: 16px; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--acc-ink); }
.tab-ind {
  position: absolute; top: 4px; left: 0; height: 38px; border-radius: 12px; background: var(--acc-soft);
  transition: transform .45s var(--ease), width .45s var(--ease);
}
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin: -2px -2px -6px; scrollbar-width: none; }
.fchip {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 99px; white-space: nowrap;
  font-size: 13px; font-weight: 700; color: var(--text-2); background: var(--surface); box-shadow: var(--shadow-1);
  transition: background .25s, color .25s, transform .25s var(--ease);
}
.fchip:hover { color: var(--text); transform: translateY(-1px); }
.fchip[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.fchip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.fchip.is-quick { background: var(--late-bg); color: var(--late-ink); }
.fchip.is-quick .lucide { width: 14px; height: 14px; }

.board { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 16px; align-items: start; overflow-x: auto; padding-bottom: 8px; }
.col { background: color-mix(in srgb, var(--surface) 55%, transparent); border-radius: var(--r-xl); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
.col[data-status="todo"] { background: color-mix(in srgb, var(--todo-bg) 70%, transparent); }
.col[data-status="doing"] { background: color-mix(in srgb, var(--doing-bg) 70%, transparent); }
.col[data-status="done"] { background: color-mix(in srgb, var(--done-bg) 70%, transparent); }
.col-head { display: flex; align-items: center; gap: 10px; padding: 4px 4px 2px 8px; }
.col-head h2 { font-size: 15px; flex: 1; }
.count { min-width: 26px; height: 22px; padding: 0 8px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--surface); color: var(--text-2); }
.col-list { position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 80px; }
.kcard {
  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px;
  background: var(--surface); box-shadow: var(--shadow-1); cursor: grab; user-select: none; -webkit-user-select: none;
  transition: box-shadow .3s var(--ease), transform .3s var(--ease);
}
.kcard:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
.kcard:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.kcard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; min-width: 0;
  font-size: 12px; font-weight: 700; color: var(--text-2); background: var(--surface-2); white-space: nowrap; overflow: hidden;
}
.kcard-title { font-weight: 700; line-height: 1.35; }
.kcard.is-done .kcard-title { color: var(--text-3); text-decoration: line-through; }
.kcard-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sub-prog { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: var(--text-3); }
.bar { flex: 1 1 auto; min-height: 6px; height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--ring-a), var(--ring-b)); transition: width .6s var(--ease); }

.placeholder { box-shadow: none !important; transform: none !important; }
.placeholder > * { visibility: hidden; }
.kcard.placeholder, .row.placeholder { background: var(--acc-soft); outline: 2px dashed color-mix(in srgb, var(--acc) 45%, transparent); outline-offset: -2px; }
.row.placeholder .row-inner { background: transparent; }
.ghost { position: fixed; z-index: 90; margin: 0; pointer-events: none; box-shadow: var(--shadow-3) !important; }
.ghost.row .row-inner { background: var(--surface); }
body.dragging, body.dragging * { cursor: grabbing !important; }

.group { padding: 6px 8px 8px; }
.group-head2 { display: flex; align-items: center; gap: 10px; padding: 12px 12px 8px; }
.group-head2 h2 { font-size: 15px; flex: 1; }
.groups { display: flex; flex-direction: column; gap: 16px; }

.soon { padding: 40px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
.soon-ic { width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc-ink); }
.soon-ic .lucide { width: 28px; height: 28px; }
.soon p { color: var(--text-2); max-width: 46ch; }

/* ---------- Panel konteks kanan ---------- */
.context { position: sticky; top: 20px; height: calc(100dvh - 40px); overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 2px; margin: -2px; }
.panel { background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-1); padding: 18px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.panel h2 { font-size: 15px; }
.sched { display: flex; flex-direction: column; gap: 8px; }
.ev { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 16px; background: var(--surface-2); }
.ev.next { background: linear-gradient(135deg, color-mix(in srgb, var(--ring-a) 22%, var(--surface)), color-mix(in srgb, var(--ring-b) 18%, var(--surface))); }
.ev-time { display: flex; flex-direction: column; line-height: 1.2; }
.ev-time strong { font-size: 16px; font-weight: 800; }
.ev-time span { font-size: 11.5px; color: var(--text-2); font-weight: 700; }
.ev-title { font-weight: 700; font-size: 14px; }
.ev-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12.5px; color: var(--text-2); font-weight: 600; }
.ev-meta > span { display: inline-flex; align-items: center; gap: 5px; }
.ev-meta .lucide { width: 14px; height: 14px; }
.ev .av { width: 24px; height: 24px; font-size: 10.5px; }
.dl { display: flex; flex-direction: column; gap: 2px; }
.dl-item {
  width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 10px; padding: 10px; border-radius: 12px; text-align: left;
  transition: background .2s;
}
.dl-item .due { grid-column: 2; }
.dl-item:hover { background: var(--surface-2); }
.dl-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.dl-item .t { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-item .due { font-size: 12px; }
.pj { display: flex; flex-direction: column; gap: 14px; }
.pj-item { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; border-radius: 12px; padding: 4px; margin: -4px; }
.pj-item:hover .pj-name { color: var(--acc-ink); }
.pj-top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; }
.pj-top .pj-name { flex: 1; transition: color .2s; }
.pj-top .num { color: var(--text-3); font-size: 12.5px; }
.pj .bar > span { background: var(--c); }

/* ---------- Lapisan: laci, palet, popover, lembar ---------- */
.layer { position: fixed; inset: 0; z-index: 60; visibility: hidden; pointer-events: none; transition: visibility 0s linear .45s; }
.layer.open { visibility: visible; pointer-events: auto; transition-delay: 0s; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .35s var(--ease); }
.layer.open .scrim { opacity: 1; }
.layer.clear .scrim { background: transparent; }

.drawer-panel {
  position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(468px, calc(100vw - 24px));
  display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-3);
  transform: translateX(calc(100% + 24px)); transition: transform .5s var(--ease); overflow: hidden;
}
.layer.open .drawer-panel { transform: none; }
.d-handle { display: none; }
.d-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 8px 20px; }
.d-head-actions { display: flex; align-items: center; gap: 8px; }
.d-scroll { flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 20px; }
.d-scroll > * { flex-shrink: 0; }
.d-title {
  width: 100%; border: 0; resize: none; background: transparent; font-size: 22px; font-weight: 800; letter-spacing: -.015em;
  line-height: 1.3; padding: 6px 8px; margin: 0 -8px; border-radius: 12px; overflow: hidden;
}
.d-title:hover { background: var(--surface-2); }
.d-title:focus { outline: none; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--acc-soft); }
.d-title::placeholder, .d-sec textarea::placeholder, .sub-add::placeholder { color: var(--text-3); }
.d-title.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.d-props { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.prop { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 12px; min-height: 44px; }
.prop dt { font-size: 13px; font-weight: 700; color: var(--text-3); }
.prop dd { margin: 0; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.seg-btn { height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--text-2); transition: background .25s, color .25s, box-shadow .25s; }
.seg-btn:hover { color: var(--text); }
.seg-btn[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
.seg-btn.st-todo[aria-pressed="true"] { background: var(--todo-bg); color: var(--todo-ink); box-shadow: none; }
.seg-btn.st-doing[aria-pressed="true"] { background: var(--doing-bg); color: var(--doing-ink); box-shadow: none; }
.seg-btn.st-done[aria-pressed="true"] { background: var(--done-bg); color: var(--done-ink); box-shadow: none; }
.field {
  height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600;
  transition: border-color .2s, box-shadow .2s;
}
.field:hover { border-color: var(--line-2); }
.field:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
select.field { padding-right: 32px; max-width: 100%; }
.due-inputs { display: flex; gap: 8px; flex-wrap: wrap; }
.people-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.person {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 4px; border-radius: 99px;
  font-size: 13px; font-weight: 700; color: var(--text-2); background: var(--surface-2); transition: background .2s, color .2s, box-shadow .2s;
}
.person .av { width: 26px; height: 26px; box-shadow: none; }
.person[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc-ink); }
.person[aria-pressed="false"] .av { filter: saturate(.2); opacity: .7; }
.d-sec { display: flex; flex-direction: column; gap: 10px; }
.d-sec-head { display: flex; align-items: center; justify-content: space-between; }
.d-sec h3 { font-size: 14px; font-weight: 800; }
.d-sec-head .num { font-size: 13px; color: var(--text-3); font-weight: 700; }
.subs { display: flex; flex-direction: column; gap: 2px; }
.sub { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 6px 6px 8px; border-radius: 12px; font-size: 14px; font-weight: 600; }
.sub:hover { background: var(--surface-2); }
.sub.done span { color: var(--text-3); text-decoration: line-through; }
.sub .icon-btn { opacity: 0; background: transparent; box-shadow: none; }
.sub:hover .icon-btn, .sub .icon-btn:focus-visible { opacity: 1; }
.sub-add { height: 42px; padding: 0 12px; border-radius: 12px; border: 1.5px dashed var(--line-2); background: transparent; font-size: 14px; }
.sub-add:focus { outline: none; border-style: solid; border-color: var(--acc); }
.d-sec textarea {
  width: 100%; min-height: 84px; resize: vertical; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); line-height: 1.5;
}
.d-sec textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.related { display: flex; flex-direction: column; gap: 6px; }
.rel { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); text-align: left; transition: background .2s, transform .25s var(--ease); }
.rel:hover { transform: translateX(2px); background: var(--surface-3); }
.rel-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); color: var(--acc-ink); }
.rel strong { display: block; font-size: 13.5px; }
.rel small { display: block; font-size: 12px; color: var(--text-3); font-weight: 600; }
.d-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.d-foot .note { font-size: 12.5px; color: var(--text-3); font-weight: 600; }

.dialog-panel {
  position: absolute; left: 50%; top: 12vh; width: min(620px, calc(100vw - 32px)); max-height: 72vh;
  display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-3); overflow: hidden;
  transform: translate(-50%, -10px) scale(.97); opacity: 0; transition: transform .4s var(--ease), opacity .25s;
}
.layer.open .dialog-panel { transform: translate(-50%, 0) scale(1); opacity: 1; }
.pal-input { display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.pal-input input { flex: 1; height: 60px; border: 0; background: transparent; font-size: 17px; font-weight: 600; outline: none; }
.pal-input input::placeholder { color: var(--text-3); }
.pal-list { overflow-y: auto; padding: 8px; }
.pal-group { padding: 10px 12px 4px; font-size: 12px; font-weight: 800; color: var(--text-3); }
.pal-item { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 12px; text-align: left; font-weight: 600; }
.pal-item .lucide { color: var(--text-3); }
.pal-item .meta { margin-left: auto; font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
.pal-item[aria-selected="true"] { background: var(--acc-soft); color: var(--acc-ink); }
.pal-item[aria-selected="true"] .lucide { color: var(--acc-ink); }
.pal-empty { padding: 28px; text-align: center; color: var(--text-2); }
.pal-foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); font-weight: 600; }
.pal-foot span { display: inline-flex; align-items: center; gap: 6px; }

.pop-panel {
  position: absolute; top: 76px; right: 24px; width: 340px; padding: 20px; display: flex; flex-direction: column; gap: 18px;
  background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-3);
  transform: translateY(-8px) scale(.97); transform-origin: top right; opacity: 0; transition: transform .35s var(--ease), opacity .2s;
}
.layer.open .pop-panel { transform: none; opacity: 1; }
.opt h3 { font-size: 13px; font-weight: 800; color: var(--text-2); margin-bottom: 10px; }
.opt .seg { display: flex; }
.opt .seg-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--text-2); padding: 6px 0; border-radius: 12px; }
.swatch .sw { width: 34px; height: 34px; border-radius: 50%; background: var(--sw); display: grid; place-items: center; color: #fff; transition: transform .3s var(--ease), box-shadow .3s; }
.swatch .sw .lucide { width: 16px; height: 16px; stroke-width: 3; opacity: 0; transition: opacity .2s; }
.swatch[aria-pressed="true"] .sw { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--sw); transform: scale(1.04); }
.swatch[aria-pressed="true"] .sw .lucide { opacity: 1; }
.swatch[aria-pressed="true"] { color: var(--text); }
.fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.font-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); text-align: left; transition: box-shadow .25s; }
.font-opt b { font-size: 22px; line-height: 1; }
.font-opt span { font-size: 12.5px; font-weight: 600; color: var(--text-2); line-height: 1.2; }
.font-opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--acc); background: var(--acc-soft); }
.pop-note { font-size: 12px; color: var(--text-3); }

.help-list { padding: 8px 20px 20px; display: grid; gap: 4px; }
.help-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.help-row:last-child { border-bottom: 0; }
.help-row .keys { display: flex; gap: 4px; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px 20px; }

.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88dvh; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-3);
  padding-bottom: env(safe-area-inset-bottom); transform: translateY(100%); transition: transform .5s var(--ease);
}
.layer.open .sheet-panel { transform: none; }
.sheet-grip { width: 44px; height: 5px; border-radius: 99px; background: var(--line-2); margin: 10px auto 4px; flex: none; }
.sheet-body { overflow-y: auto; padding: 8px 16px 20px; }
.ctx-panel {
  position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(360px, calc(100vw - 24px)); overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px; padding: 4px;
  transform: translateX(calc(100% + 24px)); transition: transform .5s var(--ease);
}
.layer.open .ctx-panel { transform: none; }

/* ---------- Dok bawah (HP) ---------- */
.dock {
  display: none; position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 50;
  height: 68px; padding: 0 8px; align-items: center; justify-content: space-around;
  background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-3);
}
.dock-btn { flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 16px; font-size: 11px; font-weight: 700; color: var(--text-3); transition: color .2s; }
.dock-btn[aria-current="page"] { color: var(--acc-ink); }
.dock-btn .lucide { width: 22px; height: 22px; }
.dock-add {
  width: 56px; height: 56px; flex: none; margin: 0 6px; border-radius: 20px; display: grid; place-items: center; transform: translateY(-14px);
  background: linear-gradient(135deg, var(--acc), color-mix(in srgb, var(--acc) 60%, var(--ring-b))); color: var(--on-acc);
  box-shadow: 0 14px 26px -10px var(--acc); transition: transform .3s var(--ease);
}
.dock-add:active { transform: translateY(-14px) scale(.94); }
.dock-add .lucide { width: 26px; height: 26px; stroke-width: 2.4; }

<script>
(() => {
'use strict';

/* ---------- Alat kecil ---------- */
const root = document.documentElement;
const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');

const EASE = 'cubic-bezier(.16,1,.3,1)';

/* ---------- Data contoh ---------- */

let seq = 0;
const task = (title, project, status, priority, dueIn, time, who, subtasks = [], extra = {}) => ({
  id: 't' + (++seq), title, project, status, priority, due: addDays(dueIn), time, people: who,

const isLate = (t) => t.status !== 'done' && dayDiff(t.due) < 0;
const inWeek = (d) => { const k = dayDiff(d); return k >= -mondayOffset && k <= 6 - mondayOffset; };
const byOrder = (a, b) => a.order - b.order;
const minOrder = () => Math.min(0, ...tasks.map((t) => t.order)) - 1;

function todayList() {
  return tasks.filter((t) => {
    const k = dayDiff(t.due);
    if (k === 0) return true;
    return k < 0 && (t.status !== 'done' || (t.doneAt && dayDiff(t.doneAt) === 0));
  });
}
function todayStats() {
  const list = todayList();
  const done = list.filter((t) => t.status === 'done').length;
  return {
    total: list.length, done, open: list.length - done,
    late: tasks.filter(isLate).length,
    week: tasks.filter((t) => t.status !== 'done' && inWeek(t.due)).length,

}
function dayItems(k) {
  const list = k === 0 ? todayList() : tasks.filter((t) => dayDiff(t.due) === k);
  return [...list].sort((a, b) => (a.status === 'done') - (b.status === 'done') || byOrder(a, b));
}
function filteredTasks() {
  return tasks.filter((t) => {
    if (state.project && t.project !== state.project) return false;
    if (state.quick === 'late') return isLate(t);
    if (state.quick === 'today') return t.status !== 'done' && todayList().includes(t);
    if (state.quick === 'week') return t.status !== 'done' && inWeek(t.due);
    return true;
  });
}
function subStats(t) {
  const total = t.subtasks.length, done = t.subtasks.filter((s) => s.done).length;
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}
function formatDue(t) {
  const k = dayDiff(t.due);
  if (isLate(t)) return `Terlambat ${-k} hari`;
  if (k === 0) return t.time ? `Hari ini ${t.time}` : 'Hari ini';
  if (k === 1) return t.time ? `Besok ${t.time}` : 'Besok';
  return formatShort(t.due);
}
function greeting() {
  const h = new Date().getHours();
  return h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam';
}

/* ---------- Potongan HTML ---------- */
const avatars = (ids, max = 3) => {
  if (!ids.length) return '<span class="avs" aria-label="Belum ada orang"></span>';
  const shown = ids.slice(0, max).map((id) => `<span class="av" style="--c:${people[id].color}" title="${people[id].name}">${people[id].initial}</span>`).join('');
  const more = ids.length > max ? `<span class="av more">+${ids.length - max}</span>` : '';

};
const priorityTag = (t, iconOnly = false) => `<span class="prio prio-${t.priority}${iconOnly ? ' icon-only' : ''}" title="Prioritas ${PRIORITY[t.priority]}"><i data-lucide="flag"></i><span>${PRIORITY[t.priority]}</span></span>`;
const dueTag = (t, extra = '') => `<span class="due ${isLate(t) ? 'is-late' : ''} ${extra}"><i data-lucide="${isLate(t) ? 'circle-alert' : 'clock'}"></i>${formatDue(t)}</span>`;

function rowHTML(t) {

    <div class="swipe-bg" aria-hidden="true"><span class="sw-done"><i data-lucide="check"></i>Selesai</span><span class="sw-later">Besok<i data-lucide="calendar-clock"></i></span></div>

      <div class="row-main">

        <span class="row-meta"><span class="proj"><span class="dot" style="--c:${p.color}"></span>${esc(p.name)}</span>${s.total ? `<span><i data-lucide="list-checks"></i>${s.done}/${s.total}</span>` : ''}${dueTag(t, 'due-inline')}</span>
      </div>

}
function cardHTML(t) {

    <div class="kcard-top"><span class="chip"><span class="dot" style="--c:${p.color}"></span>${esc(p.name)}</span>${priorityTag(t, true)}</div>

    <div class="kcard-foot">${t.status === 'done' ? '<span class="due"><i data-lucide="circle-check"></i>Selesai</span>' : dueTag(t)}${avatars(t.people)}</div>

}
const ringHTML = () => '<div class="ring" aria-hidden="true"><span class="ring-track"></span><span class="ring-arc"></span><span class="ring-cap start"></span><span class="ring-cap end"></span></div>';
/* Kartu melayang: tugas paling mendesak (terlambat dulu, lalu prioritas tinggi hari ini). */
function urgentTask() {
  const open = tasks.filter((t) => t.status !== 'done');
  return open.filter(isLate).sort((a, b) => a.due - b.due)[0]
    || open.filter((t) => t.priority === 'tinggi' && dayDiff(t.due) === 0).sort(byOrder)[0];
}
function urgentHTML() {
  const t = urgentTask();
  if (!t) return '';
  return `<div class="urgent" data-task="${t.id}">
    <button class="check" data-check="${t.id}" role="checkbox" aria-checked="false" aria-label="Tandai selesai: ${esc(t.title)}"><i data-lucide="check"></i></button>

    <span class="u-meta">${dueTag(t)}${avatars(t.people)}</span>
  </div>`;
}
function weekHTML() {
  return Array.from({ length: 7 }, (_, i) => {
    const k = i - mondayOffset, d = addDays(k);
    const dots = tasks.filter((t) => t.status !== 'done' && dayDiff(t.due) === k).slice(0, 3)
      .map((t) => `<i style="--c:${projectOf(t).color}"></i>`).join('');

function scheduleHTML() {

    $$('#view .row, #view .kcard').slice(0, 12).forEach((el, i) =>
      el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: 60 + i * 28, easing: EASE, fill: 'backwards' }));
  }

  if (animate) window.scrollTo({ top: 0, behavior: 'instant' });
  firstRender = false;

let ringShown = 0;
function updateHome(initial) {
  const s = todayStats(), ring = $('.ring-wrap');
  if (!ring) return;
  const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
  if (initial) { ring.style.transition = 'none'; ring.style.setProperty('--p', 0); ring.getBoundingClientRect(); ring.style.transition = ''; ringShown = 0; }
  else { $('#urgent-slot').innerHTML = urgentHTML(); icons(); }
  ring.classList.toggle('is-empty', pct === 0);
  requestAnimationFrame(() => ring.style.setProperty('--p', pct));
  countTo($('#ring-pct'), ringShown, pct, '%');
  ringShown = pct;
  $('#hero-text').textContent = s.total ? `${s.done} dari ${s.total} tugas selesai` : 'Belum ada tugas untuk hari ini';
  $('#st-late').textContent = s.late; $('#st-today').textContent = s.open; $('#st-week').textContent = s.week;
  $('#head-sub').textContent = `${formatLong(today)} · ${s.open ? `${s.open} tugas menunggu` : 'semua tugas hari ini selesai'}`;
}
function countTo(el, from, to, suffix = '') {
  if (!el) return;
  if (reduceMotion() || from === to) { el.textContent = to + suffix; return; }
  const start = performance.now(), dur = 800;
  const step = (now) => {
    const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(2, -10 * p);
    el.textContent = Math.round(from + (to - from) * (p === 1 ? 1 : e)) + suffix;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function renderContext() {
  $('#context').innerHTML = contextHTML();
  $('#ctx-layer-body').innerHTML = contextHTML();
  icons();
}

/* FLIP: catat posisi lama, ubah DOM, lalu animasikan dari posisi lama ke baru. */
function flip(containers, mutate) {
  const lists = containers.filter(Boolean);
  if (reduceMotion()) { mutate(); return; }
  const first = new Map();
  lists.forEach((c) => [...c.children].forEach((el) => { if (el.dataset.key) first.set(el.dataset.key, el.getBoundingClientRect()); }));
  mutate();
  lists.forEach((c) => [...c.children].forEach((el) => {
    const key = el.dataset.key;
    if (!key) return;
    const f = first.get(key), l = el.getBoundingClientRect();
    if (!f) { el.animate([{ opacity: 0, transform: 'scale(.97) translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 340, easing: EASE }); return; }
    const dx = f.left - l.left, dy = f.top - l.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 420, easing: EASE });
  }));
}
function refresh({ fromDrawer = false } = {}) {
  const focusedId = document.activeElement?.closest?.('[data-task]')?.dataset.task;
  if (state.view === 'home') {
    const list = $('#home-list');
    flip([list], () => { list.innerHTML = homeItemsHTML(); icons(); });
    $('#week').innerHTML = weekHTML();
    $('#list-title').textContent = listTitle();
    updateHome(false);
  } else if (state.view === 'tasks') {
    $('#filters').innerHTML = filtersHTML();
    $('#head-sub').textContent = tasksSub();

  const list = $('#pal-list');
  paletteItems = buildPaletteItems($('#pal-q').value);
  paletteIndex = Math.min(paletteIndex, Math.max(0, paletteItems.length - 1));
  if (!paletteItems.length) { list.innerHTML = '<p class="pal-empty">Tidak ada yang cocok. Coba kata lain.</p>'; return; }
  let html = '', lastKind = '';
  paletteItems.forEach((item, i) => {
    if (item.kind !== lastKind) { html += `<div class="pal-group" role="presentation">${item.kind}</div>`; lastKind = item.kind; }
    html += `<button class="pal-item" role="option" id="pal-${i}" data-pal="${i}" aria-selected="${i === paletteIndex}"><i data-lucide="${item.icon}"></i><span>${esc(item.label)}</span>${item.meta ? `<span class="meta">${esc(item.meta)}</span>` : ''}</button>`;
  });
  list.innerHTML = html;
  $('#pal-q').setAttribute('aria-activedescendant', `pal-${paletteIndex}`);
  icons();
}
function openPalette() {
  if (layers.some((l) => l.el.id === 'palette')) return;
  $('#pal-q').value = ''; paletteIndex = 0; renderPalette();
  openLayer($('#palette'), { focus: $('#pal-q') });
}
function runPaletteItem(i) { const item = paletteItems[i]; if (!item) return; closeTop(); item.run(); }
$('#pal-q').addEventListener('input', () => { paletteIndex = 0; renderPalette(); });
$('#pal-q').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    paletteIndex = (paletteIndex + (e.key === 'ArrowDown' ? 1 : -1) + paletteItems.length) % Math.max(1, paletteItems.length);
    renderPalette(); $(`#pal-${paletteIndex}`)?.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter') { e.preventDefault(); runPaletteItem(paletteIndex); }
});
$('#pal-list').addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-pal]');
  if (el && Number(el.dataset.pal) !== paletteIndex) { paletteIndex = Number(el.dataset.pal); $$('.pal-item').forEach((x, i) => x.setAttribute('aria-selected', String(i === paletteIndex))); }
});

/* ---------- Pengaturan tampilan ---------- */
function renderAppearance() {
  const accents = [['ungu', 'Ungu', '#6C5CE7'], ['biru', 'Biru', '#2F6FE0'], ['hijau', 'Hijau', '#0A7D5C'], ['oranye', 'Oranye', '#BA490A'], ['magenta', 'Magenta', '#CF2E6C']];
  const fonts = [['jakarta', 'Plus Jakarta Sans', "'Plus Jakarta Sans'"], ['manrope', 'Manrope', "'Manrope'"], ['dmsans', 'DM Sans', "'DM Sans'"], ['nunito', 'Nunito', "'Nunito'"]];
  $('#appearance-body').innerHTML = `
    <div class="dlg-head" style="padding:0"><h2>Tampilan</h2><button class="icon-btn flat sm" data-action="close" aria-label="Tutup"><i data-lucide="x"></i></button></div>
    <div class="opt"><h3>Tema</h3><div class="seg" role="group" aria-label="Tema">
      <button class="seg-btn" data-pref="theme" data-v="light" aria-pressed="${prefs.theme === 'light'}"><i data-lucide="sun"></i>Terang</button>
      <button class="seg-btn" data-pref="theme" data-v="dark" aria-pressed="${prefs.theme === 'dark'}"><i data-lucide="moon"></i>Gelap</button></div></div>
    <div class="opt"><h3>Warna aksen</h3><div class="swatches">${accents.map(([id, label, color]) => `<button class="swatch" data-pref="accent" data-v="${id}" aria-pressed="${prefs.accent === id}"><span class="sw" style="--sw:${color}"><i data-lucide="check"></i></span>${label}</button>`).join('')}</div></div>
    <div class="opt"><h3>Huruf</h3><div class="fonts">${fonts.map(([id, label, family]) => `<button class="font-opt" data-pref="font" data-v="${id}" aria-pressed="${prefs.font === id}" style="font-family:${family}"><b>Aa</b><span>${label}</span></button>`).join('')}</div></div>
    <p class="pop-note">Pilihan disimpan di peramban ini.</p>`;
  icons();
}

/* ---------- Klik ---------- */
document.addEventListener('click', (e) => {
  if (Date.now() < suppressClickUntil && e.target.closest('[data-drag]')) { e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener('click', (e) => {
  const t = e.target;
  let el;
  if ((el = t.closest('[data-check]'))) { toggleDone(el.dataset.check, el); return; }
  if ((el = t.closest('[data-pal]'))) { runPaletteItem(Number(el.dataset.pal)); return; }
  if ((el = t.closest('[data-pref]'))) { setPref(el.dataset.pref, el.dataset.v); return; }
  if ((el = t.closest('[data-action]'))) { runAction(el.dataset.action, el); return; }
  if ((el = t.closest('[data-group]'))) {
    const open = el.getAttribute('aria-expanded') !== 'true';
    el.setAttribute('aria-expanded', String(open));
    if (el.closest('#nav')) { prefs.groups[el.dataset.group] = open; savePrefs(); setTimeout(placeNavIndicator, reduceMotion() ? 0 : 420); }
    return;
  }
  if ((el = t.closest('[data-nav]'))) {
    const opts = {};
    if ('quick' in el.dataset) { opts.quick = el.dataset.quick; opts.project = null; if (el.dataset.quick !== 'week') opts.tab = 'list'; }
    else if (el.dataset.nav === 'tasks' && el.closest('.sidebar, .dock, #menu')) { opts.quick = null; opts.project = null; }
    go(el.dataset.nav, opts);
    return;
  }
  if ((el = t.closest('[data-proj]'))) {
    const id = el.dataset.proj || null;
    if (state.view === 'tasks' && !el.closest('.sidebar, #menu, .context, #ctx-layer')) { state.project = id; refresh(); }
    else go('tasks', { project: id, quick: null });
    return;
  }
  if ((el = t.closest('[data-tab]'))) {
    state.tab = el.dataset.tab;
    if (state.view !== 'tasks') { go('tasks'); return; }
    $$('.tab').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.tab === state.tab)));
    placeTabIndicator();
    const body = $('#task-body');
    body.innerHTML = taskBodyHTML(); icons();
    if (!reduceMotion()) body.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 360, easing: EASE });
    return;
  }
  if ((el = t.closest('[data-new]'))) { newTask({ status: el.dataset.new }); return; }
  if ((el = t.closest('[data-day]'))) {
    state.day = Number(el.dataset.day);
    $$('.day').forEach((d) => d.setAttribute('aria-pressed', String(Number(d.dataset.day) === state.day)));
    $('#list-title').textContent = listTitle();
    const list = $('#home-list');
    flip([list], () => { list.innerHTML = homeItemsHTML(); icons(); });
    return;
  }
  if ((el = t.closest('[data-task]'))) { openTask(el.dataset.task); }
});
function runAction(action, el) {
  const t = drawerTask;
  switch (action) {
    case 'close': closeTop(); break;
    case 'palette': openPalette(); break;
    case 'new-task': newTask(); break;
    case 'appearance': renderAppearance(); openLayer($('#appearance')); break;
    case 'context': openLayer($('#ctx-layer')); break;
    case 'menu': openLayer($('#menu')); break;
    case 'undo': runUndo(); break;
    case 'clear-quick': state.quick = null; refresh(); break;
    case 'd-done': toggleDone(t.id, null); break;
    case 'd-save': saveNewTask(); break;
    case 'd-delete': {
      const index = tasks.indexOf(t);
      tasks.splice(index, 1); closeTop(); refresh();
      toast('Tugas dihapus', () => { tasks.splice(index, 0, t); refresh(); });
      break;
    }
    case 'set-status':
      if (t.status !== el.dataset.v) { t.prevStatus = t.status; t.status = el.dataset.v; t.doneAt = t.status === 'done' ? new Date() : null; }
      renderDrawer(); if (drawerMode === 'edit') refresh({ fromDrawer: true });
      $(`#drawer [data-action="set-status"][data-v="${el.dataset.v}"]`)?.focus();
      break;
    case 'set-priority':
      t.priority = el.dataset.v; renderDrawer(); if (drawerMode === 'edit') refresh({ fromDrawer: true });
      $(`#drawer [data-action="set-priority"][data-v="${el.dataset.v}"]`)?.focus();
      break;
    case 'toggle-person': {
      const k = el.dataset.v;
      t.people = t.people.includes(k) ? t.people.filter((x) => x !== k) : [...t.people, k];
      renderDrawer(); if (drawerMode === 'edit') refresh({ fromDrawer: true });
      $(`#drawer [data-action="toggle-person"][data-v="${k}"]`)?.focus();
      break;
    }
    case 'sub-toggle': {
      const i = Number(el.dataset.i);
      t.subtasks[i].done = !t.subtasks[i].done;
      renderDrawer(); if (drawerMode === 'edit') refresh({ fromDrawer: true });
      $(`#drawer [data-action="sub-toggle"][data-i="${i}"]`)?.focus();
      break;
    }
    case 'sub-delete':
      t.subtasks.splice(Number(el.dataset.i), 1);
      renderDrawer(); if (drawerMode === 'edit') refresh({ fromDrawer: true });
      $('#drawer .sub-add')?.focus();
      break;
  }
}

/* ---------- Papan ketik ---------- */
function focusableTasks() { return $$('#view .row[data-task], #view .kcard[data-task]').filter((el) => el.offsetParent); }
function moveFocus(dir) {
  const items = focusableTasks();
  if (!items.length) return;
  const i = items.indexOf(document.activeElement?.closest('[data-task]'));
  const next = items[i < 0 ? 0 : Math.max(0, Math.min(items.length - 1, i + dir))];
  next.focus(); next.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
}
document.addEventListener('keydown', (e) => {
  const key = e.key;
  if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'k') { e.preventDefault(); if (layers.some((l) => l.el.id === 'palette')) closeTop(); else openPalette(); return; }
  if (key === 'Escape') { if (pointer?.mode === 'drag') { endDrag(true); pointer = null; return; } if (closeTop()) e.preventDefault(); return; }
  const typing = e.target.closest('input, textarea, select, [contenteditable]');
  if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'z' && !typing && undoAction) { e.preventDefault(); runUndo(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || layers.length) return;
  const current = e.target.closest?.('[data-task]');
  if (key === '/') { e.preventDefault(); openPalette(); }
  else if (key === 'n' || key === 'N') { e.preventDefault(); newTask(); }
  else if (key === '?') { e.preventDefault(); openLayer($('#help')); }
  else if (key === 'j' || key === 'J') { e.preventDefault(); moveFocus(1); }
  else if (key === 'k' || key === 'K') { e.preventDefault(); moveFocus(-1); }
  else if ((key === 'x' || key === 'X') && current) { e.preventDefault(); toggleDone(current.dataset.task, current.querySelector('.check')); }
  else if ((key === 'Enter' || key === 'e') && current && e.target === current) { e.preventDefault(); openTask(current.dataset.task); }
  else if (current?.classList.contains('kcard') && e.shiftKey && (key === 'ArrowRight' || key === 'ArrowLeft')) { e.preventDefault(); moveStatus(current.dataset.task, key === 'ArrowRight' ? 1 : -1); }
  else if (current && (key === 'ArrowDown' || key === 'ArrowUp') && !e.shiftKey) {
    e.preventDefault();
    const sibling = key === 'ArrowDown' ? current.nextElementSibling : current.previousElementSibling;
    sibling?.matches('[data-task]') ? sibling.focus() : moveFocus(key === 'ArrowDown' ? 1 : -1);
  }
});

/* ---------- Mulai ---------- */
addEventListener('hashchange', () => { closeAllLayers(); render(true); });
addEventListener('resize', () => { placeNavIndicator(); placeTabIndicator(false); });
renderNav();
render(false);
document.fonts?.ready.then(() => { placeNavIndicator(); placeTabIndicator(false); });
})();
</script>
</body>
