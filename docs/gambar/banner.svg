<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="judul deskripsi">
  <title id="judul">Kopdes Manager 3D</title>
  <desc id="deskripsi">Ruang kerja manajer koperasi desa dengan Dunia Koperasi 3D: diorama kantor isometrik berwarna biru dan kayu hangat.</desc>
  <defs>
    <linearGradient id="latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="0.55" stop-color="#eaf0ff"/>
      <stop offset="1" stop-color="#e3e8fb"/>
    </linearGradient>
    <radialGradient id="sinar" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#8fa9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fa9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="biru" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d92ff"/>
      <stop offset="1" stop-color="#2448c7"/>
    </linearGradient>
    <linearGradient id="kayu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c48f"/>
      <stop offset="1" stop-color="#cf9a5b"/>
    </linearGradient>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1c2d5f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#latar)"/>
  <rect width="1280" height="420" rx="28" fill="url(#sinar)"/>

  <!-- Teks -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect x="72" y="92" width="196" height="34" rx="17" fill="#ffffff" stroke="#cfdcfd"/>
    <circle cx="94" cy="109" r="6" fill="#22a55a"/>
    <text x="108" y="114" font-size="15" font-weight="600" fill="#2148c7">Three.js · Next.js 16</text>
    <text x="72" y="190" font-size="58" font-weight="800" fill="#0b1533" letter-spacing="-1.5">Kopdes Manager</text>
    <text x="72" y="190" dx="476" font-size="58" font-weight="800" fill="url(#biru)" letter-spacing="-1.5">3D</text>
    <text x="72" y="236" font-size="22" font-weight="500" fill="#4b5675">Ruang kerja manajer koperasi desa,</text>
    <text x="72" y="266" font-size="22" font-weight="500" fill="#4b5675">dihidupkan dalam diorama kantor 3D.</text>
    <g font-size="15" font-weight="600" fill="#2148c7" text-anchor="middle">
      <rect x="72" y="300" width="96" height="34" rx="10" fill="#ffffff" stroke="#e6eaf2"/>
      <text x="120" y="322">Tugas</text>
      <rect x="178" y="300" width="112" height="34" rx="10" fill="#ffffff" stroke="#e6eaf2"/>
      <text x="234" y="322">Buku kas</text>
      <rect x="300" y="300" width="100" height="34" rx="10" fill="#ffffff" stroke="#e6eaf2"/>
      <text x="350" y="322">Gudang</text>
      <rect x="410" y="300" width="92" height="34" rx="10" fill="#ffffff" stroke="#e6eaf2"/>
      <text x="456" y="322">Rapat</text>
    </g>
  </g>

  <!-- Diorama isometrik -->
  <g transform="translate(910 236) scale(0.9)" filter="url(#bayang)">
    <!-- alas kayu -->
    <path d="M0 -150 L260 0 L0 150 L-260 0 Z" fill="#f4e7d4"/>
    <path d="M-260 0 L0 150 L0 172 L-260 22 Z" fill="url(#kayu)"/>
    <path d="M260 0 L0 150 L0 172 L260 22 Z" fill="#b98247"/>
    <!-- dinding belakang -->
    <path d="M-260 0 L0 -150 L0 -232 L-260 -82 Z" fill="#c9d3ef"/>
    <path d="M0 -150 L260 0 L260 -82 L0 -232 Z" fill="#b7c3e6"/>
    <path d="M-260 -82 L0 -232 L8 -228 L-252 -78 Z" fill="#e5ebfb"/>
    <path d="M0 -232 L260 -82 L252 -78 L-8 -228 Z" fill="#dfe6fa"/>
    <!-- jendela -->
    <path d="M-200 -48 L-120 -94 L-120 -150 L-200 -104 Z" fill="#dff1ff" stroke="#ffffff" stroke-width="5"/>
    <path d="M60 -116 L140 -70 L140 -126 L60 -172 Z" fill="#dff1ff" stroke="#ffffff" stroke-width="5"/>
    <circle cx="-150" cy="-114" r="10" fill="#ffd36e"/>
    <!-- sekat kaca -->
    <path d="M-130 75 L130 -75 L130 -128 L-130 22 Z" fill="#ffffff" fill-opacity="0.45" stroke="#ffffff" stroke-width="3"/>
    <!-- lantai ruang terpilih -->
    <path d="M-10 18 L110 88 L40 128 L-80 58 Z" fill="#dfe7ff" stroke="#2f5bea" stroke-width="4"/>
    <!-- meja -->
    <g>
      <path d="M-160 -10 L-100 25 L-130 42 L-190 7 Z" fill="#f0d6ae"/>
      <path d="M-190 7 L-130 42 L-130 50 L-190 15 Z" fill="#c9965c"/>
      <path d="M-130 42 L-100 25 L-100 33 L-130 50 Z" fill="#b07c45"/>
      <rect x="-158" y="-12" width="22" height="16" rx="3" fill="#2b3554"/>
    </g>
    <g>
      <path d="M20 40 L80 75 L50 92 L-10 57 Z" fill="#f0d6ae"/>
      <path d="M-10 57 L50 92 L50 100 L-10 65 Z" fill="#c9965c"/>
      <path d="M50 92 L80 75 L80 83 L50 100 Z" fill="#b07c45"/>
      <rect x="22" y="38" width="22" height="16" rx="3" fill="#2b3554"/>
    </g>
    <!-- rak barang -->
    <g>
      <path d="M150 -40 L200 -11 L200 -71 L150 -100 Z" fill="#8f7fd0"/>
      <rect x="160" y="-82" width="16" height="14" fill="#f2b56b" transform="skewY(30)"/>
      <path d="M154 -66 L196 -42" stroke="#ffffff" stroke-width="3"/>
      <path d="M154 -44 L196 -20" stroke="#ffffff" stroke-width="3"/>
    </g>
    <!-- tanaman -->
    <g>
      <rect x="-224" y="-6" width="14" height="14" rx="3" fill="#d27d5a"/>
      <circle cx="-217" cy="-16" r="13" fill="#5bb36a"/>
      <circle cx="-208" cy="-24" r="9" fill="#74c97f"/>
    </g>
    <!-- figur -->
    <g>
      <ellipse cx="34" cy="60" rx="10" ry="4" fill="#1c2d5f" opacity="0.15"/>
      <rect x="27" y="36" width="14" height="22" rx="6" fill="#2f5bea"/>
      <circle cx="34" cy="28" r="10" fill="#f2c9a0"/>
      <path d="M24 26 Q34 12 44 26 Z" fill="#2b2b3a"/>
    </g>
    <g>
      <ellipse cx="-118" cy="22" rx="10" ry="4" fill="#1c2d5f" opacity="0.15"/>
      <rect x="-125" y="-2" width="14" height="22" rx="6" fill="#22a55a"/>
      <circle cx="-118" cy="-10" r="10" fill="#d9a77c"/>
      <path d="M-129 -10 Q-118 -26 -107 -10 L-107 -2 L-129 -2 Z" fill="#7c5cf0"/>
    </g>
    <!-- pin -->
    <g transform="translate(172 -122)">
      <path d="M0 0 C-14 -14 -14 -36 0 -36 C14 -36 14 -14 0 0 Z" fill="url(#biru)"/>
      <circle cx="0" cy="-24" r="5" fill="#ffffff"/>
    </g>
    <!-- label pil -->
    <g transform="translate(-4 -6)" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700">
      <rect x="-58" y="-16" width="86" height="28" rx="8" fill="#2f5bea"/>
      <text x="-48" y="3" fill="#ffffff">Ruang kerja</text>
      <rect x="28" y="-16" width="58" height="28" rx="8" fill="#ffffff" stroke="#cfdcfd"/>
      <text x="38" y="3" fill="#2148c7" font-weight="600">2 figur</text>
    </g>
  </g>
</svg>
